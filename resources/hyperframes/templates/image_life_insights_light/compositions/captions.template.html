<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Pixelle HyperFrames - Life Insights Light Captions</title>
    <link rel="stylesheet" href="../runtime/fonts/phase1_fonts.css" />
    <script src="../runtime/vendor/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: __CANVAS_WIDTH__px;
        height: __CANVAS_HEIGHT__px;
        overflow: hidden;
        font-family: var(--hf-font-sans);
      }

      [data-composition-id="captions"] {
        position: relative;
        width: __CANVAS_WIDTH__px;
        height: __CANVAS_HEIGHT__px;
        overflow: hidden;
      }

      #captions-shell {
        position: absolute;
        left: 88px;
        right: 88px;
        bottom: 124px;
        padding: 28px 34px 34px;
        border-radius: 30px;
        background: rgba(255, 250, 245, 0.9);
        box-shadow: 0 18px 54px rgba(56, 33, 19, 0.12);
      }

      .captions-label {
        margin-bottom: 20px;
        color: #d76c43;
        font-size: 20px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      #captions-container {
        position: relative;
        min-height: 158px;
      }

      .caption-group {
        position: absolute;
        inset: 0;
        opacity: 0;
        visibility: hidden;
        will-change: transform, opacity;
      }

      .caption-text {
        font-size: 56px;
        line-height: 1.04;
        letter-spacing: -0.04em;
        color: #1f1b18;
        white-space: normal;
      }
    </style>
  </head>
  <body>
    <div
      id="captions-root"
      data-composition-id="captions"
      data-width="__CANVAS_WIDTH__"
      data-height="__CANVAS_HEIGHT__"
      data-start="0"
      data-duration="__DURATION__"
    >
      <div id="captions-shell">
        <div class="captions-label">Key takeaway</div>
        <div id="captions-container">__CAPTIONS__</div>
      </div>
    </div>
    <script>
      function padTimelineToDuration(timeline, duration) {
        const resolvedDuration = Math.max(Number(duration) || 0, 0);
        const currentDuration = Math.max(Number(timeline.duration()) || 0, 0);
        if (resolvedDuration > currentDuration) {
          timeline.to({}, { duration: resolvedDuration - currentDuration });
        }
        return timeline;
      }

      (function bootstrapCaptionsTimeline() {
        const root = document.getElementById("captions-root");
        const duration = Math.max(Number(root?.dataset?.duration || 0), 0);
        const captions = Array.from(document.querySelectorAll(".caption-group"));
        const tl = gsap.timeline({ paused: true });

        gsap.set(captions, { autoAlpha: 0, y: 18 });
        captions.forEach((caption) => {
          const start = Number(caption.dataset.start || 0);
          const clipDuration = Math.max(Number(caption.dataset.duration || 0), 0.1);
          const fadeOutAt = Math.max(start + 0.12, start + clipDuration - 0.12);

          tl.to(
            caption,
            { autoAlpha: 1, y: 0, duration: 0.18, ease: "power2.out" },
            start,
          );
          tl.to(
            caption,
            { autoAlpha: 0, y: -10, duration: 0.12, ease: "power2.in" },
            fadeOutAt,
          );
        });

        padTimelineToDuration(tl, duration);
        window.__timelines = window.__timelines || {};
        window.__timelines["captions"] = tl;
      })();
    </script>
  </body>
</html>
