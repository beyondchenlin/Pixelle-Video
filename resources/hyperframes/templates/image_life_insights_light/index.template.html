<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__CANVAS_WIDTH__, height=__CANVAS_HEIGHT__" />
    <title>Pixelle HyperFrames - Life Insights Light</title>
    <link rel="stylesheet" href="./runtime/fonts/phase1_fonts.css" />
    <script src="./runtime/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: __CANVAS_WIDTH__px;
        height: __CANVAS_HEIGHT__px;
        overflow: hidden;
      }

      body {
        font-family: var(--hf-font-display);
        background: #f5f1e8;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
        color: #1a1611;
      }

      #main-comp {
        position: relative;
        width: __CANVAS_WIDTH__px;
        height: __CANVAS_HEIGHT__px;
        overflow: hidden;
      }

      .bg-pattern {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .dot-pattern {
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(circle, rgba(120, 90, 70, 0.15) 1.5px, transparent 1.5px),
          radial-gradient(circle, rgba(100, 75, 60, 0.12) 1px, transparent 1px);
        background-size: 40px 40px, 80px 80px;
        background-position: 0 0, 20px 20px;
        opacity: 0.8;
      }

      .grid-pattern {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(110, 85, 65, 0.12) 1px, transparent 1px),
          linear-gradient(90deg, rgba(110, 85, 65, 0.12) 1px, transparent 1px);
        background-size: 60px 60px;
        opacity: 0.7;
      }

      .decorative-circle {
        position: absolute;
        border-radius: 50%;
        border: 1.5px solid rgba(110, 85, 65, 0.15);
        background: rgba(140, 110, 90, 0.08);
      }

      .circle-1 {
        width: 400px;
        height: 400px;
        top: -150px;
        right: -100px;
      }

      .circle-2 {
        width: 300px;
        height: 300px;
        bottom: -100px;
        left: -80px;
      }

      .circle-3 {
        width: 200px;
        height: 200px;
        top: 50%;
        left: -50px;
        transform: translateY(-50%);
      }

      .header {
        margin-top: 200px;
        text-align: center;
        position: relative;
        z-index: 2;
      }

      .title {
        font-size: 80px;
        font-weight: 900;
        line-height: 1.4;
        letter-spacing: 3px;
        background: linear-gradient(135deg, #1a1611 0%, #2c2416 50%, #1a1611 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: contrast(1.1) brightness(0.9);
      }

      .content {
        display: flex;
        flex: 1;
        justify-content: center;
        align-items: center;
        position: relative;
        z-index: 2;
        width: 100%;
      }

      .content .visual-clip {
        position: relative;
        width: 600px;
        height: 600px;
        will-change: transform, opacity;
      }

      .content .visual-frame {
        width: 100%;
        height: 100%;
      }

      .content .visual-clip__media {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .content .corner-mark,
      .content .side-dots {
        display: none;
      }

      .bottom-section {
        width: 100%;
        padding: 0 40px;
        text-align: center;
        position: relative;
        z-index: 2;
        margin-bottom: 200px;
      }

      .content-text {
        font-size: 50px;
        font-weight: 400;
        color: #000;
        line-height: 1.8;
        margin-bottom: 30px;
      }

      .author {
        width: 100%;
        font-size: 30px;
        font-family: var(--hf-font-brush);
        margin: 0 20px 20px 0;
        text-align: right;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 100px;
        z-index: 3;
      }

      #captions-layer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 120px;
        height: 360px;
        z-index: 4;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="main-comp"
      data-composition-id="main-comp"
      data-width="__CANVAS_WIDTH__"
      data-height="__CANVAS_HEIGHT__"
      data-start="0"
      data-duration="__DURATION__"
      data-style-profile="__STYLE_PROFILE__"
    >
      <div class="bg-pattern">
        <div class="dot-pattern"></div>
        <div class="grid-pattern"></div>
        <div class="decorative-circle circle-1"></div>
        <div class="decorative-circle circle-2"></div>
        <div class="decorative-circle circle-3"></div>
      </div>

      <div class="header">
        <div class="title">__TITLE__</div>
      </div>

      <div class="content">__VISUALS__</div>

      <div class="bottom-section">
        <div class="content-text">__FOOTER__</div>
      </div>

      <div class="author">__AUTHOR__</div>

      <div
        id="captions-layer"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-track-index="3"
        data-duration="__DURATION__"
      ></div>

      __AUDIO__
    </div>
    <script>
      function padTimelineToDuration(timeline, duration) {
        const resolvedDuration = Math.max(Number(duration) || 0, 0);
        const currentDuration = Math.max(Number(timeline.duration()) || 0, 0);
        if (resolvedDuration > currentDuration) {
          timeline.to({}, { duration: resolvedDuration - currentDuration });
        }
        return timeline;
      }

      (function bootstrapMainTimeline() {
        const root = document.getElementById("main-comp");
        const duration = Math.max(Number(root?.dataset?.duration || 0), 0);
        const tl = gsap.timeline({ paused: true });

        tl.fromTo(
          ".header",
          { y: 28, autoAlpha: 0 },
          { y: 0, autoAlpha: 1, duration: 0.5, ease: "power2.out" },
          0,
        );

        tl.fromTo(
          ".bottom-section",
          { y: 16, autoAlpha: 0 },
          { y: 0, autoAlpha: 1, duration: 0.4, ease: "power2.out" },
          0.16,
        );
        tl.fromTo(
          ".author",
          { y: 12, autoAlpha: 0 },
          { y: 0, autoAlpha: 1, duration: 0.35, ease: "power2.out" },
          0.2,
        );

        padTimelineToDuration(tl, duration);
        window.__timelines = window.__timelines || {};
        window.__timelines["main-comp"] = tl;
      })();
    </script>
  </body>
</html>
