<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Pixelle HyperFrames - Image Landscape Full Text Layer</title>
    <link rel="stylesheet" href="../runtime/fonts/phase1_fonts.css" />
    <script src="../runtime/vendor/gsap.min.js"></script>
    <style>
      html, body, #text-layer-root { margin: 0; width: __CANVAS_WIDTH__px; height: __CANVAS_HEIGHT__px; overflow: hidden; }
      .text-cue { position: absolute; left: var(--text-left); right: var(--text-right); top: var(--text-top); bottom: var(--text-bottom); transform: var(--text-transform); width: min(var(--text-max-width), calc(100% - var(--text-margin-x) - var(--text-margin-x))); opacity: 0; visibility: hidden; max-width: var(--text-max-width); display: flex; justify-content: var(--text-justify-content); align-items: var(--text-align-items); text-align: var(--text-text-align); }
      .text-cue__content { display: inline-block; padding: 0; border-radius: 0; background: var(--text-background); color: var(--text-fill); font-family: var(--text-font-family); font-size: var(--text-font-size); line-height: var(--text-line-height); font-weight: var(--text-font-weight); text-align: var(--text-text-align); -webkit-text-stroke: var(--text-stroke-width) var(--text-stroke-color); box-shadow: none; text-shadow: 0 10px 30px rgba(0,0,0,0.48), -2px -2px 0 rgba(0,0,0,0.92), 2px -2px 0 rgba(0,0,0,0.92), -2px 2px 0 rgba(0,0,0,0.92), 2px 2px 0 rgba(0,0,0,0.92); }
    </style>
  </head>
  <body>
    <div id="text-layer-root" data-composition-id="text-layer" data-width="__CANVAS_WIDTH__" data-height="__CANVAS_HEIGHT__" data-start="0" data-duration="__DURATION__">
      __TEXT_CUES__
    </div>
    <script>
      function padTimelineToDuration(timeline, duration) {
        const resolvedDuration = Math.max(Number(duration) || 0, 0);
        const currentDuration = Math.max(Number(timeline.duration()) || 0, 0);
        if (resolvedDuration > currentDuration) {
          timeline.to({}, { duration: resolvedDuration - currentDuration });
        }
        return timeline;
      }

      (function bootstrapTextLayerTimeline() {
        __TEXT_TIMELINE__
      })();
    </script>
  </body>
</html>
