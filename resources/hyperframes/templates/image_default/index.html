<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Pixelle HyperFrames - Image Default</title>
    <link rel="stylesheet" href="./runtime/fonts/phase1_fonts.css" />
    <script src="./runtime/vendor/gsap.min.js"></script>
    <style>
      :root {
        --frame-width: 1080px;
        --frame-height: 1920px;
        --bg: #fafafa;
        --ink: #1a252f;
        --muted: #5d6d7e;
        --accent: rgba(149, 165, 166, 0.55);
        --line: rgba(149, 165, 166, 0.28);
      }

      html,
      body {
        margin: 0;
        width: var(--frame-width);
        height: var(--frame-height);
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: "PingFang SC", "Source Han Sans", "Microsoft YaHei", sans-serif;
      }

      #main-comp {
        position: relative;
        width: var(--frame-width);
        height: var(--frame-height);
        overflow: hidden;
      }

      .bg-decoration,
      #visual-layer,
      #copy-layer,
      #captions-layer {
        position: absolute;
        inset: 0;
      }

      .bg-decoration {
        pointer-events: none;
        z-index: 0;
      }

      .circle-outline {
        position: absolute;
        border-radius: 50%;
        border: 2px solid rgba(44, 62, 80, 0.12);
      }

      .circle-outline.one {
        width: 350px;
        height: 350px;
        top: 10%;
        right: -100px;
      }

      .circle-outline.two {
        width: 280px;
        height: 280px;
        bottom: 15%;
        left: -80px;
      }

      .circle-outline.three {
        width: 180px;
        height: 180px;
        top: 50%;
        left: 100px;
      }

      .line-decoration {
        position: absolute;
        height: 2px;
        background: var(--line);
      }

      .line-decoration.one {
        width: 250px;
        top: 20%;
        left: 80px;
        transform: rotate(-5deg);
      }

      .line-decoration.two {
        width: 180px;
        top: 55%;
        right: 120px;
        transform: rotate(8deg);
      }

      .line-decoration.three {
        width: 200px;
        bottom: 25%;
        left: 120px;
        transform: rotate(-3deg);
      }

      .square-minimal {
        position: absolute;
        width: 14px;
        height: 14px;
        background: rgba(149, 165, 166, 0.35);
      }

      .square-minimal.one {
        top: 15%;
        left: 50px;
      }

      .square-minimal.two {
        top: 45%;
        right: 80px;
      }

      .square-minimal.three {
        bottom: 20%;
        left: 100px;
        transform: rotate(45deg);
      }

      #visual-layer {
        z-index: 10;
        pointer-events: none;
      }

      .visual-clip {
        position: absolute;
        left: 90px;
        right: 90px;
        top: 360px;
        height: 900px;
      }

      .visual-frame {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .visual-clip__media {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 8px;
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.06);
        display: block;
      }

      .corner-mark {
        position: absolute;
        width: 50px;
        height: 3px;
        background: rgba(149, 165, 166, 0.45);
      }

      .corner-mark::after {
        content: "";
        position: absolute;
        width: 3px;
        height: 50px;
        background: rgba(149, 165, 166, 0.45);
      }

      .corner-mark.tl {
        top: -18px;
        left: -18px;
      }

      .corner-mark.tl::after {
        left: 0;
        top: 0;
      }

      .corner-mark.tr {
        top: -18px;
        right: -18px;
      }

      .corner-mark.tr::after {
        right: 0;
        top: 0;
      }

      .corner-mark.bl {
        bottom: -18px;
        left: -18px;
      }

      .corner-mark.bl::after {
        left: 0;
        bottom: 0;
      }

      .corner-mark.br {
        bottom: -18px;
        right: -18px;
      }

      .corner-mark.br::after {
        right: 0;
        bottom: 0;
      }

      .side-dots {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .side-dots.left {
        left: -30px;
      }

      .side-dots.right {
        right: -30px;
      }

      .side-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(149, 165, 166, 0.4);
      }

      .side-dot.active {
        width: 10px;
        height: 10px;
        background: rgba(149, 165, 166, 0.65);
      }

      #copy-layer {
        z-index: 20;
        pointer-events: none;
      }

      .page-container {
        position: absolute;
        inset: 0;
        padding: 80px 60px 90px;
        box-sizing: border-box;
      }

      .video-title-wrapper {
        position: absolute;
        top: 150px;
        left: 140px;
        right: 140px;
        text-align: center;
      }

      .video-title-ornament-top {
        position: absolute;
        top: -40px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .ornament-line {
        width: 40px;
        height: 2px;
        background: var(--accent);
      }

      .ornament-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(149, 165, 166, 0.65);
      }

      .video-title {
        position: relative;
        margin: 0;
        font-size: 68px;
        font-weight: 600;
        color: var(--ink);
        line-height: 1.4;
        letter-spacing: 2px;
      }

      .video-title::after {
        content: "";
        position: absolute;
        bottom: -20px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 2px;
        background: rgba(149, 165, 166, 0.4);
      }

      .footer {
        position: absolute;
        left: 115px;
        right: 115px;
        bottom: 105px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 25px 10px 0;
        border-top: 2px solid rgba(149, 165, 166, 0.3);
      }

      .footer::before {
        content: "";
        position: absolute;
        top: -3px;
        left: 50%;
        transform: translateX(-50%);
        width: 70px;
        height: 3px;
        background: rgba(149, 165, 166, 0.55);
      }

      .author-name,
      .logo {
        color: var(--ink);
      }

      .author-name {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 30px;
        font-weight: 600;
      }

      .author-mark {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(149, 165, 166, 0.7);
      }

      .author-desc {
        margin-top: 6px;
        font-size: 22px;
        line-height: 1.3;
        color: var(--muted);
      }

      .logo-section {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }

      .logo {
        font-size: 24px;
        font-weight: 500;
        letter-spacing: 2px;
      }

      .logo-marks {
        display: flex;
        gap: 5px;
      }

      .logo-mark {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(149, 165, 166, 0.45);
      }

      .logo-mark.active {
        background: rgba(149, 165, 166, 0.75);
      }

      #captions-layer {
        z-index: 30;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="main-comp"
      data-composition-id="main-comp"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="8"
    >
      <div class="bg-decoration">
        <div class="circle-outline one"></div>
        <div class="circle-outline two"></div>
        <div class="circle-outline three"></div>
        <div class="line-decoration one"></div>
        <div class="line-decoration two"></div>
        <div class="line-decoration three"></div>
        <div class="square-minimal one"></div>
        <div class="square-minimal two"></div>
        <div class="square-minimal three"></div>
      </div>

      <div id="visual-layer"></div>

      <div id="copy-layer">
        <div class="page-container">
          <div class="video-title-wrapper">
            <div class="video-title-ornament-top">
              <div class="ornament-line"></div>
              <div class="ornament-dot"></div>
              <div class="ornament-line"></div>
            </div>
            <h1 class="video-title" id="headline">Default title placeholder</h1>
          </div>

          <div class="footer">
            <div class="author">
              <div class="author-name">
                <span class="author-mark"></span>
                <span id="author-name">LanRen.AI</span>
              </div>
              <div class="author-desc" id="author-desc">LanRen</div>
            </div>
            <div class="logo-section">
              <div class="logo" id="brand-name">懒人同城</div>
              <div class="logo-marks">
                <div class="logo-mark"></div>
                <div class="logo-mark active"></div>
                <div class="logo-mark"></div>
                <div class="logo-mark"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div
        id="captions-layer"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-track-index="3"
        data-duration="8"
      ></div>
    </div>

    <script>
      async function fetchJson(url) {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`Failed to load ${url}: ${response.status}`);
        }
        return response.json();
      }

      function resolveDuration(manifest) {
        const ranges = [];
        for (const clip of manifest.visual_clips || []) {
          ranges.push(Number(clip.end || 0));
        }
        for (const cue of manifest.caption_cues || []) {
          ranges.push(Number(cue.end || 0));
        }
        for (const block of manifest.audio_blocks || []) {
          ranges.push(Number(block.end || 0));
        }
        return Math.max(8, ...ranges, 0);
      }

      function padTimelineToDuration(timeline, duration) {
        const resolvedDuration = Math.max(Number(duration) || 0, 0);
        const currentDuration = Math.max(Number(timeline.duration()) || 0, 0);
        if (resolvedDuration > currentDuration) {
          timeline.to({}, { duration: resolvedDuration - currentDuration });
        }
        return timeline;
      }

      function applyFrameSize(root, manifest) {
        const width = manifest.width || 1080;
        const height = manifest.height || 1920;
        document.documentElement.style.setProperty("--frame-width", `${width}px`);
        document.documentElement.style.setProperty("--frame-height", `${height}px`);
        root.setAttribute("data-width", String(width));
        root.setAttribute("data-height", String(height));
      }

      function mountVisualClips(manifest) {
        const visualLayer = document.getElementById("visual-layer");
        visualLayer.innerHTML = "";

        const clips = manifest.visual_clips || [];
        if (!clips.length) {
          return;
        }

        for (const clip of clips) {
          const wrapper = document.createElement("div");
          wrapper.className = "visual-clip";

          const frame = document.createElement("div");
          frame.className = "visual-frame";

          const media =
            clip.media_type === "video"
              ? document.createElement("video")
              : document.createElement("img");

          media.className = "visual-clip__media";
          media.setAttribute("src", clip.media_path);
          media.setAttribute("data-start", String(clip.start || 0));
          media.setAttribute("data-duration", String(Math.max((clip.end || 0) - (clip.start || 0), 0.1)));
          media.setAttribute("data-track-index", String(clip.track_index ?? 1));

          if (clip.media_type === "video") {
            media.muted = true;
            media.playsInline = true;
          }

          frame.appendChild(media);
          ["tl", "tr", "bl", "br"].forEach((position) => {
            const mark = document.createElement("div");
            mark.className = `corner-mark ${position}`;
            frame.appendChild(mark);
          });

          ["left", "right"].forEach((side) => {
            const dots = document.createElement("div");
            dots.className = `side-dots ${side}`;
            for (let index = 0; index < 3; index += 1) {
              const dot = document.createElement("div");
              dot.className = `side-dot${index === 1 ? " active" : ""}`;
              dots.appendChild(dot);
            }
            frame.appendChild(dots);
          });

          wrapper.appendChild(frame);
          visualLayer.appendChild(wrapper);
        }
      }

      function mountAudio(manifest) {
        if (!manifest.master_audio_path) {
          return;
        }

        let audio = document.getElementById("master-audio");
        if (!audio) {
          audio = document.createElement("audio");
          audio.id = "master-audio";
          document.getElementById("main-comp").appendChild(audio);
        }

        audio.setAttribute("src", manifest.master_audio_path);
        audio.setAttribute("data-start", "0");
        audio.setAttribute("data-duration", String(resolveDuration(manifest)));
      }

      (async function bootstrap() {
        const [manifest, captionsPayload] = await Promise.all([
          fetchJson("./data/render_manifest.json"),
          fetchJson("./data/captions.json").catch(() => ({ captions: [] })),
        ]);

        const root = document.getElementById("main-comp");
        const headline = document.getElementById("headline");

        headline.textContent = manifest.title || "Default title placeholder";
        applyFrameSize(root, manifest);

        const duration = resolveDuration(manifest);
        root.setAttribute("data-duration", String(duration));
        document.getElementById("captions-layer").setAttribute("data-duration", String(duration));

        if ((captionsPayload.captions || []).length > 0) {
          document.getElementById("author-desc").textContent = "Key insight sequence";
        }

        mountVisualClips(manifest);
        mountAudio(manifest);

        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          ".video-title-wrapper",
          { y: 30, autoAlpha: 0 },
          { y: 0, autoAlpha: 1, duration: 0.55, ease: "power2.out" },
          0,
        );
        tl.fromTo(
          ".visual-clip",
          { y: 22, autoAlpha: 0.92, scale: 1.015 },
          { y: 0, autoAlpha: 1, scale: 1, duration: 0.9, ease: "power2.out" },
          0.05,
        );
        tl.fromTo(
          ".footer",
          { y: 18, autoAlpha: 0 },
          { y: 0, autoAlpha: 1, duration: 0.45, ease: "power2.out" },
          0.18,
        );
        padTimelineToDuration(tl, duration);

        window.__timelines = window.__timelines || {};
        window.__timelines["main-comp"] = tl;
      })();
    </script>
  </body>
</html>
