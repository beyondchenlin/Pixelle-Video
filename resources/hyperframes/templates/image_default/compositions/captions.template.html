<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Pixelle HyperFrames - Image Default Captions</title>
    <link rel="stylesheet" href="../runtime/fonts/phase1_fonts.css" />
    <script src="../runtime/vendor/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: __CANVAS_WIDTH__px;
        height: __CANVAS_HEIGHT__px;
        overflow: hidden;
        font-family: var(--hf-font-sans);
      }

      [data-composition-id="captions"] {
        position: relative;
        width: __CANVAS_WIDTH__px;
        height: __CANVAS_HEIGHT__px;
        overflow: hidden;
      }

      #captions-shell {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      #captions-container {
        position: absolute;
        inset: 0;
      }

      .caption-group {
        position: absolute;
        left: var(--text-left);
        right: var(--text-right);
        top: var(--text-top);
        bottom: var(--text-bottom);
        transform: var(--text-transform);
        width: min(var(--text-max-width), calc(100% - var(--text-margin-x) - var(--text-margin-x)));
        max-width: var(--text-max-width);
        display: flex;
        align-items: var(--text-align-items);
        justify-content: var(--text-justify-content);
        text-align: var(--text-text-align);
        opacity: 0;
        visibility: hidden;
        will-change: opacity;
      }

      .caption-text {
        padding: 20px 40px;
        color: var(--text-fill);
        font-family: var(--text-font-family);
        font-size: var(--text-font-size);
        font-weight: var(--text-font-weight);
        line-height: var(--text-line-height);
        text-align: var(--text-text-align);
        background: var(--text-background);
        -webkit-text-stroke: var(--text-stroke-width) var(--text-stroke-color);
      }

      .quote-minimal {
        position: absolute;
        opacity: 0.25;
      }

      .quote-minimal.left {
        top: -10px;
        left: 0;
        transform: rotate(180deg);
      }

      .quote-minimal.right {
        right: 0;
        bottom: 44px;
      }

      .divider-set {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        margin-top: 24px;
      }

      .divider {
        height: 2px;
        background: rgba(149, 165, 166, 0.35);
      }

      .divider.short {
        width: 40px;
      }

      .divider.long {
        width: 80px;
      }

      .divider-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(149, 165, 166, 0.45);
      }
    </style>
  </head>
  <body>
    <div
      id="captions-root"
      data-composition-id="captions"
      data-width="__CANVAS_WIDTH__"
      data-height="__CANVAS_HEIGHT__"
      data-start="0"
      data-duration="__DURATION__"
    >
      <div id="captions-shell">
        <svg
          class="quote-minimal left"
          width="60"
          height="60"
          viewBox="0 0 24 24"
          fill="#95a5a6"
        >
          <path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z" />
        </svg>
        <svg
          class="quote-minimal right"
          width="60"
          height="60"
          viewBox="0 0 24 24"
          fill="#95a5a6"
        >
          <path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z" />
        </svg>

        <div id="captions-container">__CAPTIONS__</div>

        <div class="divider-set">
          <div class="divider short"></div>
          <div class="divider-dot"></div>
          <div class="divider long"></div>
          <div class="divider-dot"></div>
          <div class="divider short"></div>
        </div>
      </div>
    </div>
    <script>
      function padTimelineToDuration(timeline, duration) {
        const resolvedDuration = Math.max(Number(duration) || 0, 0);
        const currentDuration = Math.max(Number(timeline.duration()) || 0, 0);
        if (resolvedDuration > currentDuration) {
          timeline.to({}, { duration: resolvedDuration - currentDuration });
        }
        return timeline;
      }

      (function bootstrapCaptionsTimeline() {
        const root = document.getElementById("captions-root");
        const duration = Math.max(Number(root?.dataset?.duration || 0), 0);
        const captions = Array.from(document.querySelectorAll(".caption-group"));
        const tl = gsap.timeline({ paused: true });

        gsap.set(captions, { autoAlpha: 0 });
        captions.forEach((caption) => {
          const start = Number(caption.dataset.start || 0);
          const clipDuration = Math.max(Number(caption.dataset.duration || 0), 0.1);
          tl.set(caption, { autoAlpha: 1, visibility: "visible" }, start);
          tl.set(
            caption,
            { autoAlpha: 0, visibility: "hidden" },
            start + clipDuration,
          );
        });

        padTimelineToDuration(tl, duration);
        window.__timelines = window.__timelines || {};
        window.__timelines["captions"] = tl;
      })();
    </script>
  </body>
</html>
