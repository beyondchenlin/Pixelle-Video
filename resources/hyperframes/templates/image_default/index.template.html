<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__CANVAS_WIDTH__, height=__CANVAS_HEIGHT__" />
    <title>Pixelle HyperFrames - Image Default</title>
    <link rel="stylesheet" href="./runtime/fonts/phase1_fonts.css" />
    <style>
      :root {
        --frame-width: __CANVAS_WIDTH__px;
        --frame-height: __CANVAS_HEIGHT__px;
        --bg: #fafafa;
        --ink: #1a252f;
        --muted: #5d6d7e;
        --accent: rgba(149, 165, 166, 0.55);
        --line: rgba(149, 165, 166, 0.28);
      }

      html,
      body {
        margin: 0;
        width: var(--frame-width);
        height: var(--frame-height);
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--hf-font-sans);
      }

      #main-comp {
        position: relative;
        width: var(--frame-width);
        height: var(--frame-height);
        overflow: hidden;
      }

      .bg-decoration,
      .page-container,
      #captions-layer {
        position: absolute;
        inset: 0;
      }

      .bg-decoration {
        pointer-events: none;
        z-index: 0;
      }

      .circle-outline {
        position: absolute;
        border-radius: 50%;
        border: 2px solid rgba(44, 62, 80, 0.12);
      }

      .circle-outline.one {
        width: 350px;
        height: 350px;
        top: 10%;
        right: -100px;
      }

      .circle-outline.two {
        width: 280px;
        height: 280px;
        bottom: 15%;
        left: -80px;
      }

      .circle-outline.three {
        width: 180px;
        height: 180px;
        top: 50%;
        left: 100px;
      }

      .line-decoration {
        position: absolute;
        height: 2px;
        background: var(--line);
      }

      .line-decoration.one {
        width: 250px;
        top: 20%;
        left: 80px;
        transform: rotate(-5deg);
      }

      .line-decoration.two {
        width: 180px;
        top: 55%;
        right: 120px;
        transform: rotate(8deg);
      }

      .line-decoration.three {
        width: 200px;
        bottom: 25%;
        left: 120px;
        transform: rotate(-3deg);
      }

      .square-minimal {
        position: absolute;
        width: 14px;
        height: 14px;
        background: rgba(149, 165, 166, 0.35);
      }

      .square-minimal.one {
        top: 15%;
        left: 50px;
      }

      .square-minimal.two {
        top: 45%;
        right: 80px;
      }

      .square-minimal.three {
        bottom: 20%;
        left: 100px;
        transform: rotate(45deg);
      }

      .page-container {
        z-index: 10;
        padding: 80px 60px 90px;
        box-sizing: border-box;
      }

      .video-title-wrapper {
        position: absolute;
        top: 150px;
        left: 140px;
        right: 140px;
        text-align: center;
      }

      .video-title-ornament-top {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin-bottom: 36px;
      }

      .ornament-line {
        width: 40px;
        height: 2px;
        background: var(--accent);
      }

      .ornament-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(149, 165, 166, 0.65);
      }

      .video-title {
        margin: 0;
        font-size: 68px;
        font-weight: 600;
        line-height: 1.4;
        letter-spacing: 2px;
      }

      .image-wrapper {
        position: absolute;
        left: 90px;
        right: 90px;
        top: 360px;
        height: 900px;
      }

      .image-container {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .visual-clip {
        position: absolute;
        inset: 0;
      }

      .visual-frame {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .visual-clip__media {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 8px;
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.06);
        display: block;
      }

      .corner-mark {
        position: absolute;
        width: 50px;
        height: 3px;
        background: rgba(149, 165, 166, 0.45);
      }

      .corner-mark::after {
        content: "";
        position: absolute;
        width: 3px;
        height: 50px;
        background: rgba(149, 165, 166, 0.45);
      }

      .corner-mark.tl {
        top: -18px;
        left: -18px;
      }

      .corner-mark.tl::after {
        left: 0;
        top: 0;
      }

      .corner-mark.tr {
        top: -18px;
        right: -18px;
      }

      .corner-mark.tr::after {
        right: 0;
        top: 0;
      }

      .corner-mark.bl {
        bottom: -18px;
        left: -18px;
      }

      .corner-mark.bl::after {
        left: 0;
        bottom: 0;
      }

      .corner-mark.br {
        bottom: -18px;
        right: -18px;
      }

      .corner-mark.br::after {
        right: 0;
        bottom: 0;
      }

      .side-dots {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .side-dots.left {
        left: -30px;
      }

      .side-dots.right {
        right: -30px;
      }

      .side-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(149, 165, 166, 0.4);
      }

      .side-dot.active {
        width: 10px;
        height: 10px;
        background: rgba(149, 165, 166, 0.65);
      }

      .footer {
        position: absolute;
        left: 115px;
        right: 115px;
        bottom: 92px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 25px 10px 0;
        border-top: 2px solid rgba(149, 165, 166, 0.3);
      }

      .footer::before {
        content: "";
        position: absolute;
        top: -3px;
        left: 50%;
        transform: translateX(-50%);
        width: 70px;
        height: 3px;
        background: rgba(149, 165, 166, 0.55);
      }

      .author {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .author-name {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 30px;
        font-weight: 600;
      }

      .author-mark {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(149, 165, 166, 0.7);
      }

      .author-desc,
      .brand-text {
        font-size: 22px;
        color: var(--muted);
        line-height: 1.3;
      }

      .logo-section {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }

      .brand-name {
        font-size: 24px;
        font-weight: 500;
        letter-spacing: 2px;
      }

      .logo-marks {
        display: flex;
        gap: 5px;
      }

      .logo-mark {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(149, 165, 166, 0.45);
      }

      .logo-mark.active {
        background: rgba(149, 165, 166, 0.75);
      }

      #captions-layer {
        z-index: 30;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="main-comp"
      data-composition-id="main-comp"
      data-width="__CANVAS_WIDTH__"
      data-height="__CANVAS_HEIGHT__"
      data-start="0"
      data-duration="__DURATION__"
      data-style-profile="__STYLE_PROFILE__"
    >
      <div class="bg-decoration">
        <div class="circle-outline one"></div>
        <div class="circle-outline two"></div>
        <div class="circle-outline three"></div>
        <div class="line-decoration one"></div>
        <div class="line-decoration two"></div>
        <div class="line-decoration three"></div>
        <div class="square-minimal one"></div>
        <div class="square-minimal two"></div>
        <div class="square-minimal three"></div>
      </div>

      <div class="page-container">
        <div class="video-title-wrapper">
          <div class="video-title-ornament-top">
            <div class="ornament-line"></div>
            <div class="ornament-dot"></div>
            <div class="ornament-line"></div>
          </div>
          <h1 class="video-title">__TITLE__</h1>
        </div>

        <div class="image-wrapper">
          <div class="image-container">__VISUALS__</div>
        </div>

        <div class="footer">
          <div class="author">
            <div class="author-name">
              <span class="author-mark"></span>
              <span>__AUTHOR__</span>
            </div>
            <div class="author-desc">__AUTHOR_DESC__</div>
          </div>
          <div class="logo-section">
            <div class="brand-name">__FOOTER__</div>
            <div class="logo-marks">
              <div class="logo-mark"></div>
              <div class="logo-mark active"></div>
              <div class="logo-mark"></div>
              <div class="logo-mark"></div>
            </div>
          </div>
        </div>
      </div>

      <div
        id="captions-layer"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-track-index="3"
        data-duration="__DURATION__"
      ></div>

      __AUDIO__
    </div>
  </body>
</html>
