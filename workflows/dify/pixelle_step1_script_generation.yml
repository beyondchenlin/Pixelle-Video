    - data:
        code: |
          import hashlib
          import json
          import re
          from typing import Any


          SENTENCE_END_PATTERN = r'[。！？.!?]+[\s"\'"\'）)}】」』]*'


          def _extract_json_object(text: str) -> dict:
              raw = str(text or '').strip()
              fence_match = re.search(r'```(?:json)?\s*(.*?)```', raw, flags=re.S | re.I)
              if fence_match:
                  raw = fence_match.group(1).strip()
              try:
                  payload = json.loads(raw)
              except Exception:
                  start = raw.find('{')
                  end = raw.rfind('}')
                  if start < 0 or end <= start:
                      raise ValueError('smart storyboard response must be a JSON object')
                  payload = json.loads(raw[start:end + 1])
              if not isinstance(payload, dict):
                  raise ValueError('smart storyboard response must be a JSON object')
              return payload


          def _split_into_sentences(text: str) -> list[tuple[str, int, int]]:
              sentences = []
              last_end = 0
              for match in re.finditer(SENTENCE_END_PATTERN, text):
                  end = match.end()
                  sentence = text[last_end:end].strip()
                  if sentence:
                      actual_start = last_end
                      while actual_start < end and text[actual_start].isspace():
                          actual_start += 1
                      sentences.append((sentence, actual_start, end))
                  last_end = end
              if last_end < len(text):
                  remaining = text[last_end:].strip()
                  if remaining:
                      actual_start = last_end
                      while actual_start < len(text) and text[actual_start].isspace():
                          actual_start += 1
                      sentences.append((remaining, actual_start, len(text)))
              return sentences


          def _coerce_int(value: Any) -> int | None:
              if value is None or value == '':
                  return None
              try:
                  return int(value)
              except Exception:
                  return None


          def _normalize_indices(value: Any, field_name: str) -> list[int] | None:
              if value is None:
                  return None
              if isinstance(value, int):
                  return [value]
              if isinstance(value, str):
                  try:
                      value = json.loads(value)
                  except Exception as exc:
                      raise ValueError(f'Cannot parse {field_name}: {value}') from exc
              if not isinstance(value, list) or not value:
                  return None
              return [int(item) for item in value]


          def _require_consecutive(indices: list[int], label: str) -> tuple[int, int]:
              first = min(indices)
              last = max(indices)
              if indices != list(range(first, last + 1)):
                  raise ValueError(f'{label} must be consecutive')
              return first, last


          def _sha256(text: str) -> str:
              return hashlib.sha256(text.encode('utf-8')).hexdigest()


          def _frame_id(mode: str, count_mode: str, requested_scene_count: int | None, digest: str, frame: dict) -> str:
              seed = '|'.join([
                  mode,
                  count_mode,
                  '' if requested_scene_count is None else str(requested_scene_count),
                  digest,
                  str(frame['index']),
                  '' if frame.get('source_start') is None else str(frame.get('source_start')),
                  '' if frame.get('source_end') is None else str(frame.get('source_end')),
                  _sha256(frame['source_text']),
              ])
              return f"frame_{frame['index']:04d}_{_sha256(seed)[:12]}"


          def _build_plan(
              *,
              mode: str,
              count_mode: str,
              requested_scene_count: int | None,
              source_text: str,
              frames: list[dict],
              strategy: str,
          ) -> dict:
              digest = _sha256(source_text)
              for frame in frames:
                  frame['frame_id'] = _frame_id(mode, count_mode, requested_scene_count, digest, frame)
              identity = '|'.join([
                  mode,
                  count_mode,
                  '' if requested_scene_count is None else str(requested_scene_count),
                  digest,
                  str(len(frames)),
                  *[
                      '|'.join([
                          str(frame['index']),
                          str(frame.get('source_start')),
                          str(frame.get('source_end')),
                          _sha256(frame['source_text']),
                      ])
                      for frame in frames
                  ],
              ])
              return {
                  'plan_id': f'plan_{_sha256(identity)[:16]}',
                  'revision': 1,
                  'mode': mode,
                  'count_mode': count_mode,
                  'requested_scene_count': requested_scene_count,
                  'resolved_scene_count': len(frames),
                  'source_text': source_text,
                  'source_digest': digest,
                  'frames': frames,
                  'diagnostics': {
                      'strategy': strategy,
                      'requested_scene_count': requested_scene_count,
                      'split_count': len(frames),
                  },
              }


          def _frame_from_payload(index: int, payload: dict, source_text: str, start: int, end: int, metadata: dict) -> dict:
              return {
                  'frame_id': '',
                  'index': index,
                  'source_text': source_text[start:end],
                  'visual_goal': str(payload.get('visual_goal') or '').strip(),
                  'prompt_intent': str(payload.get('prompt_intent') or '').strip(),
                  'shot_type': None,
                  'shot_purpose': None,
                  'primary_subject': None,
                  'secondary_subjects': [],
                  'continuity_anchors': [],
                  'world_elements': [],
                  'source_start': start,
                  'source_end': end,
                  'metadata': metadata,
              }


          def _frames_from_source_spans(response_frames: list[dict], source_text: str, source_spans: list[dict]) -> list[dict]:
              frames = []
              covered = set()
              next_expected = 0
              for index, frame_payload in enumerate(response_frames, start=1):
                  indices = _normalize_indices(frame_payload.get('source_span_indices'), 'source_span_indices')
                  if not indices:
                      raise ValueError(f'Frame {index} missing source_span_indices')
                  first, last = _require_consecutive(indices, 'source_span_indices')
                  if first != next_expected:
                      raise ValueError('source_span_indices must cover source_text in source order')
                  for span_index in indices:
                      if span_index < 0 or span_index >= len(source_spans):
                          raise ValueError(f'Frame {index} has invalid source span index: {span_index}')
                      if span_index in covered:
                          raise ValueError(f'Frame {index} overlaps source span {span_index}')
                      covered.add(span_index)
                  start = int(source_spans[first]['source_start'])
                  end = int(source_spans[last]['source_end'])
                  next_expected = last + 1
                  frames.append(_frame_from_payload(index, frame_payload, source_text, start, end, {
                      'strategy': 'smart_source_spans',
                      'source_span_indices': indices,
                  }))
              if len(covered) != len(source_spans):
                  raise ValueError('Some source spans were not covered')
              return frames


          def _frames_from_sentence_indices(response_frames: list[dict], source_text: str, sentences: list[tuple[str, int, int]]) -> list[dict] | None:
              frames = []
              covered = set()
              next_expected = 0
              for index, frame_payload in enumerate(response_frames, start=1):
                  indices = _normalize_indices(frame_payload.get('sentence_indices'), 'sentence_indices')
                  if not indices:
                      return None
                  first, last = _require_consecutive(indices, 'sentence_indices')
                  if first != next_expected:
                      return None
                  for sentence_index in indices:
                      if sentence_index < 0 or sentence_index >= len(sentences):
                          return None
                      if sentence_index in covered:
                          return None
                      covered.add(sentence_index)
                  start = sentences[first][1]
                  end = sentences[last][2]
                  next_expected = last + 1
                  frames.append(_frame_from_payload(index, frame_payload, source_text, start, end, {
                      'strategy': 'smart',
                      'sentence_indices': indices,
                  }))
              if len(covered) != len(sentences):
                  return None
              return frames


          def _frames_from_char_offsets(response_frames: list[dict], source_text: str) -> list[dict]:
              frames = []
              search_start = 0
              for index, frame_payload in enumerate(response_frames, start=1):
                  fragment = str(frame_payload.get('source_text') or '').strip()
                  if not fragment:
                      raise ValueError(f'Frame {index} source_text must not be empty')
                  start = source_text.find(fragment, search_start)
                  if start < 0:
                      raise ValueError('smart storyboard frame source_text must be traceable')
                  end = start + len(fragment)
                  if start > search_start and frames:
                      frames[-1]['source_end'] = start
                      frames[-1]['source_text'] = source_text[frames[-1]['source_start']:start]
                  search_start = max(search_start, end)
                  frames.append(_frame_from_payload(index, frame_payload, source_text, start, end, {'strategy': 'smart'}))
              if frames and search_start < len(source_text):
                  frames[-1]['source_end'] = len(source_text)
                  frames[-1]['source_text'] = source_text[frames[-1]['source_start']:]
              return frames


          def main(
              raw_llm_output: str,
              source_text: str,
              storyboard_count_mode: str,
              requested_scene_count: str = '',
              min_scene_count: int | float | str = 1,
              max_scene_count: int | float | str = 30,
              source_spans_json: str = '[]',
          ) -> dict:
              response = _extract_json_object(raw_llm_output)
              response_frames = response.get('frames')
              if not isinstance(response_frames, list) or not response_frames:
                  raise ValueError('smart storyboard response must include non-empty frames')

              count_mode = str(storyboard_count_mode or 'auto').strip() or 'auto'
              requested = _coerce_int(requested_scene_count)
              min_count = _coerce_int(min_scene_count) or 1
              max_count = _coerce_int(max_scene_count) or 30
              if count_mode == 'manual' and len(response_frames) != requested:
                  raise ValueError(f'expected {requested} smart storyboard frames')
              if len(response_frames) > max_count:
                  raise ValueError('too many storyboard frames')
              if count_mode == 'auto' and len(response_frames) < min_count:
                  raise ValueError('too few storyboard frames')

              text = str(source_text or '').strip()
              source_spans = json.loads(source_spans_json or '[]')
              sentences = _split_into_sentences(text)
              use_source_spans = bool(source_spans) and any(
                  frame.get('source_span_indices') is not None for frame in response_frames
              )
              if use_source_spans:
                  frames = _frames_from_source_spans(response_frames, text, source_spans)
                  strategy = 'smart_source_spans'
              else:
                  frames = _frames_from_sentence_indices(response_frames, text, sentences)
                  strategy = 'smart'
                  if frames is None:
                      frames = _frames_from_char_offsets(response_frames, text)
                      strategy = 'smart_char_offsets'

              for frame in frames:
                  if not frame['visual_goal']:
                      raise ValueError('smart storyboard visual_goal must not be empty')
                  if not frame['prompt_intent']:
                      raise ValueError('smart storyboard prompt_intent must not be empty')

              plan = _build_plan(
                  mode='smart',
                  count_mode=count_mode,
                  requested_scene_count=requested,
                  source_text=text,
                  frames=frames,
                  strategy=strategy,
              )
              return {
                  'raw_llm_output': str(raw_llm_output or ''),
                  'storyboard_plan_json': json.dumps(plan, ensure_ascii=False, indent=2),
                  'frames_json': json.dumps(frames, ensure_ascii=False, indent=2),
                  'resolved_scene_count': len(frames),
                  'parse_strategy': strategy,
              }
        code_language: python3
