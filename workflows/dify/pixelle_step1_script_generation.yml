    - data:
        code: |
          import hashlib
          import json
          import re
          import unicodedata
          from typing import Any


          SENTENCE_TERMINATORS = '。！？.!?'
          CLOSING_PUNCTUATION = '”’"\'）)]}》】」』'
          SMART_MIN_SCENE_COUNT = 1
          SMART_MAX_SCENE_COUNT = 30
          DETERMINISTIC_MAX_SCENE_COUNT_DEFAULT = 60
          DETERMINISTIC_MAX_SCENE_COUNT_LIMIT = 200


          def _normalize_generated_source_text(text: str) -> str:
              cleaned = re.sub(r'\\u([0-9a-fA-F]{4})', lambda match: chr(int(match.group(1), 16)), text or '')
              cleaned = cleaned.replace('\r\n', '\n').replace('\r', '\n')
              cleaned = re.sub(r'[\\/]+n', ' ', cleaned, flags=re.IGNORECASE)
              cleaned = re.sub(r'[\\/]+(?=\s|$)', ' ', cleaned)
              return re.sub(r'\s+', ' ', cleaned.strip())


          def _is_unicode_punctuation(char: str) -> bool:
              return unicodedata.category(char).startswith('P')


          def _is_storyboard_split_punctuation(char: str) -> bool:
              return _is_unicode_punctuation(char) and char not in {'%', '％', '《', '》'}


          def _split_with_predicate(source_text: str, predicate) -> list[tuple[str, int, int]]:
              cleaned = _normalize_generated_source_text(source_text)
              if not cleaned:
                  return []

              segments = []
              current_start = None
              has_text = False

              for index, char in enumerate(cleaned):
                  if current_start is None:
                      if char.isspace():
                          continue
                      current_start = index

                  if not char.isspace() and not _is_unicode_punctuation(char):
                      has_text = True

                  next_char = cleaned[index + 1] if index + 1 < len(cleaned) else ''
                  should_split = has_text and predicate(char) and (
                      not next_char or not predicate(next_char)
                  )
                  if should_split and current_start is not None:
                      end = index + 1
                      segments.append((cleaned[current_start:end], current_start, end))
                      current_start = None
                      has_text = False

              if current_start is not None and has_text:
                  segments.append((cleaned[current_start:], current_start, len(cleaned)))

              return segments


          def _sentence_segments(source_text: str) -> list[tuple[str, int, int]]:
              cleaned = _normalize_generated_source_text(source_text)
              if not cleaned:
                  return []

              segments = []
              current_start = None
              index = 0
              has_text = False
              while index < len(cleaned):
                  char = cleaned[index]
                  if current_start is None:
                      if char.isspace():
                          index += 1
                          continue
                      current_start = index

                  if not char.isspace() and not _is_unicode_punctuation(char):
                      has_text = True

                  if has_text and char in SENTENCE_TERMINATORS:
                      end = index + 1
                      while end < len(cleaned) and cleaned[end] in SENTENCE_TERMINATORS:
                          end += 1
                      while end < len(cleaned) and cleaned[end] in CLOSING_PUNCTUATION:
                          end += 1
                      segments.append((cleaned[current_start:end], current_start, end))
                      current_start = None
                      has_text = False
                      index = end
                      continue

                  index += 1

              if current_start is not None and has_text:
                  segments.append((cleaned[current_start:], current_start, len(cleaned)))

              return segments


          def _split_into_sentences_for_smart_prompt(text: str) -> list[tuple[str, int, int]]:
              sentence_end_pattern = r'[。！？.!?]+[\s"\'"\'）)}】」』]*'
              sentences = []
              last_end = 0

              for match in re.finditer(sentence_end_pattern, text):
                  end = match.end()
                  sentence = text[last_end:end].strip()
                  if sentence:
                      actual_start = last_end
                      while actual_start < end and text[actual_start].isspace():
                          actual_start += 1
                      sentences.append((sentence, actual_start, end))
                  last_end = end

              if last_end < len(text):
                  remaining = text[last_end:].strip()
                  if remaining:
                      actual_start = last_end
                      while actual_start < len(text) and text[actual_start].isspace():
                          actual_start += 1
                      sentences.append((remaining, actual_start, len(text)))

              return sentences


          def _is_boundary_char(char: str) -> bool:
              return char.isspace() or unicodedata.category(char).startswith('P')


          def _nearest_source_span_boundary(text: str, ideal: int, lower: int, upper: int) -> int:
              if upper - lower <= 1:
                  return upper

              radius = max(1, len(text) // 20)
              start = max(lower + 1, ideal - radius)
              end = min(upper - 1, ideal + radius)
              candidates = []
              for index in range(start, end + 1):
                  previous_char = text[index - 1] if index > 0 else ''
                  next_char = text[index] if index < len(text) else ''
                  if previous_char and _is_boundary_char(previous_char):
                      candidates.append(index)
                  elif next_char and _is_boundary_char(next_char):
                      candidates.append(index)

              if not candidates:
                  return min(max(ideal, lower + 1), upper - 1)
              return min(candidates, key=lambda index: abs(index - ideal))


          def _split_into_source_spans(text: str, span_count: int) -> list[tuple[str, int, int]]:
              if span_count <= 0 or not text:
                  return []
              if span_count == 1:
                  return [(text, 0, len(text))]
              if span_count > len(text):
                  raise ValueError('requested_scene_count cannot exceed source_text length')

              spans = []
              start = 0
              for span_index in range(1, span_count):
                  remaining_spans = span_count - span_index
                  min_end = start + 1
                  max_end = len(text) - remaining_spans
                  ideal = round(len(text) * span_index / span_count)
                  end = _nearest_source_span_boundary(text, ideal, start, max_end)
                  end = min(max(end, min_end), max_end)
                  spans.append((text[start:end], start, end))
                  start = end
              spans.append((text[start:], start, len(text)))
              return spans


          def _coerce_int(value: Any, default: int | None = None) -> int | None:
              if value is None or value == '':
                  return default
              try:
                  return int(value)
              except Exception:
                  return default


          def _normalize_storyboard_mode(value: str) -> str:
              raw = str(value or '').strip()
              lowered = raw.lower()
              if lowered == 'punctuation' or '所有标点' in raw:
                  return 'punctuation'
              if lowered == 'sentence' or '句末标点' in raw:
                  return 'sentence'
              return 'smart'


          def _normalize_count_mode(value: str) -> str:
              raw = str(value or '').strip().lower()
              if raw == 'manual' or '分镜数' in str(value or ''):
                  return 'manual'
              return 'auto'


          def _normalize_prompt_language(value: str) -> str:
              raw = str(value or '').strip()
              if raw == 'en_US' or raw == '英文':
                  return 'en_US'
              return 'zh_CN'


          def _source_digest(text: str) -> str:
              return hashlib.sha256(text.encode('utf-8')).hexdigest()


          def _frame_dict(index: int, segment: str, start: int, end: int, language: str, strategy: str) -> dict:
              if language == 'zh_CN':
                  visual_goal = f'用画面表达第 {index} 个分镜段落。'
                  prompt_intent = f'创建一个连贯的画面来传达：{segment}'
              else:
                  visual_goal = f'Visualize storyboard segment {index}.'
                  prompt_intent = f'Create a coherent scene that communicates: {segment}'
              return {
                  'frame_id': '',
                  'index': index,
                  'source_text': segment,
                  'visual_goal': visual_goal,
                  'prompt_intent': prompt_intent,
                  'shot_type': None,
                  'shot_purpose': None,
                  'primary_subject': None,
                  'secondary_subjects': [],
                  'continuity_anchors': [],
                  'world_elements': [],
                  'source_start': start,
                  'source_end': end,
                  'metadata': {'strategy': strategy},
              }


          def _build_deterministic_plan(
              *,
              mode: str,
              count_mode: str,
              requested_scene_count: int | None,
              source_text: str,
              segments: list[tuple[str, int, int]],
              max_scene_count: int,
              prompt_language: str,
          ) -> dict:
              effective_segments = segments or [(source_text, 0, len(source_text))]
              if len(effective_segments) > max_scene_count:
                  raise ValueError('too many storyboard frames; use smart storyboard mode or shorten the text')

              digest = _source_digest(source_text)
              frames = [
                  _frame_dict(index, segment, start, end, prompt_language, mode)
                  for index, (segment, start, end) in enumerate(effective_segments, start=1)
              ]
              plan_id = f'storyboard_{mode}_{digest}'
              for frame in frames:
                  frame['frame_id'] = f"{plan_id}_frame_{frame['index']:03d}"
              return {
                  'plan_id': plan_id,
                  'revision': 1,
                  'mode': mode,
                  'count_mode': count_mode,
                  'requested_scene_count': requested_scene_count,
                  'resolved_scene_count': len(frames),
                  'source_text': source_text,
                  'source_digest': digest,
                  'frames': frames,
                  'diagnostics': {
                      'strategy': mode,
                      'split_count': len(frames),
                      'max_scene_count': max_scene_count,
                  },
              }


          def _render_smart_storyboard_prompt(
              *,
              prompt_language: str,
              source_text: str,
              sentences: list[dict],
              count_instruction: str,
              use_source_spans: bool,
              source_spans: list[dict],
          ) -> str:
              requirements = [
                  'Understand the complete source_text before creating frames.',
                  'The returned frames must cover the entire source_text in source order.',
                  'Do not omit meaningful source_text; only whitespace-only gaps between frames are allowed.',
                  'Maintain continuity of style, subjects, and visual logic across all frames.',
                  'Do not rewrite or summarize voiceover text; speech and captions are planned separately from source_text.',
                  'Do not generate final image prompts.',
                  'Return JSON only.',
              ]
              frame_schema = {
                  'source_text': 'Text preview covered by this frame (for reference).',
                  'visual_goal': (
                      '这一帧需要传达的视觉重点'
                      if prompt_language == 'zh_CN'
                      else 'What this frame should communicate visually.'
                  ),
                  'prompt_intent': 'Guidance for later image prompt composition.',
              }
              if use_source_spans:
                  requirements.extend([
                      'Use source_span_indices, not sentence_indices, because the requested frame count exceeds the sentence count.',
                      'Each frame must cover one or more consecutive source_spans.',
                      'All source_span_indices must be covered by exactly one frame in source order (no gaps, no overlaps).',
                      'When using source_span_indices, omit source_start and source_end entirely unless you can provide both integers together.',
                  ])
                  frame_schema['source_span_indices'] = 'Required: consecutive source_spans covered by this frame (e.g., [0] or [1, 2]).'
              else:
                  requirements.extend([
                      'Use sentence_indices to specify which sentences each frame covers.',
                      'Frames may cover multiple consecutive sentences (e.g., [0, 1, 2]).',
                      'Do not split one sentence across multiple frames when using sentence_indices.',
                      'All sentence indices must be covered by exactly one frame (no gaps, no overlaps).',
                      'When using sentence_indices, omit source_start and source_end entirely unless you can provide both integers together.',
                  ])
                  frame_schema['sentence_indices'] = 'Required: consecutive sentence indices covered by this frame (e.g., [0, 1] or [3]).'
              if prompt_language == 'zh_CN':
                  requirements.append('Write visual_goal and prompt_intent in Chinese.')

              payload = {
                  'task': 'create_storyboard_plan_from_complete_source_text',
                  'prompt_language': prompt_language,
                  'source_text': source_text,
                  'sentences': sentences,
                  'count_instruction': count_instruction,
                  'requirements': requirements,
                  'frame_schema': frame_schema,
              }
              if use_source_spans:
                  payload['source_spans'] = source_spans
              return (
                  '---\n'
                  'prompt_id: storyboard_generation\n'
                  'version: 1\n'
                  'stage: storyboard_generation\n'
                  'purpose: Create a storyboard plan from complete source text.\n'
                  'output_contract: JSON storyboard plan payload.\n'
                  '---\n\n'
                  '<!-- template-loader:strip # storyboard_generation -->\n'
                  + json.dumps(payload, ensure_ascii=False, indent=2)
              )


          def main(
              source_text: str,
              storyboard_mode: str = 'Smart',
              storyboard_count_mode: str = '自动',
              storyboard_scene_count: int | float | str | None = None,
              storyboard_max_scene_count: int | float | str | None = None,
              storyboard_prompt_language: str = '中文',
          ) -> dict:
              text = _normalize_generated_source_text(str(source_text or ''))
              mode = _normalize_storyboard_mode(storyboard_mode)
              prompt_language = _normalize_prompt_language(storyboard_prompt_language)

              smart_sentences = [
                  {'index': index, 'text': sentence}
                  for index, (sentence, _start, _end) in enumerate(_split_into_sentences_for_smart_prompt(text))
              ]

              count_mode = _normalize_count_mode(storyboard_count_mode)
              requested_scene_count = _coerce_int(storyboard_scene_count)
              use_source_spans = False
              source_spans = []
              deterministic_plan = {}

              if mode == 'smart':
                  if count_mode == 'manual':
                      requested_scene_count = requested_scene_count or 5
                      requested_scene_count = min(max(requested_scene_count, SMART_MIN_SCENE_COUNT), SMART_MAX_SCENE_COUNT)
                  else:
                      count_mode = 'auto'
                      requested_scene_count = None
                  max_scene_count = SMART_MAX_SCENE_COUNT
                  use_source_spans = (
                      count_mode == 'manual'
                      and requested_scene_count is not None
                      and requested_scene_count > len(smart_sentences)
                  )
                  if use_source_spans:
                      source_spans = [
                          {
                              'index': index,
                              'text': span_text,
                              'source_start': start,
                              'source_end': end,
                          }
                          for index, (span_text, start, end) in enumerate(_split_into_source_spans(text, requested_scene_count))
                      ]
                  if count_mode == 'manual':
                      count_instruction = f'Create exactly {requested_scene_count} storyboard frames.'
                  else:
                      count_instruction = f'Choose the best storyboard frame count between {SMART_MIN_SCENE_COUNT} and {SMART_MAX_SCENE_COUNT}.'
                  storyboard_route = 'smart'
              else:
                  count_mode = 'auto'
                  requested_scene_count = None
                  max_scene_count = _coerce_int(storyboard_max_scene_count, DETERMINISTIC_MAX_SCENE_COUNT_DEFAULT) or DETERMINISTIC_MAX_SCENE_COUNT_DEFAULT
                  max_scene_count = min(max(max_scene_count, 1), DETERMINISTIC_MAX_SCENE_COUNT_LIMIT)
                  segments = (
                      _split_with_predicate(text, _is_storyboard_split_punctuation)
                      if mode == 'punctuation'
                      else _sentence_segments(text)
                  )
                  deterministic_plan = _build_deterministic_plan(
                      mode=mode,
                      count_mode=count_mode,
                      requested_scene_count=requested_scene_count,
                      source_text=text,
                      segments=segments,
                      max_scene_count=max_scene_count,
                      prompt_language=prompt_language,
                  )
                  count_instruction = ''
                  storyboard_route = 'deterministic'

              smart_storyboard_prompt = (
                  _render_smart_storyboard_prompt(
                      prompt_language=prompt_language,
                      source_text=text,
                      sentences=smart_sentences,
                      count_instruction=count_instruction,
                      use_source_spans=use_source_spans,
                      source_spans=source_spans,
                  )
                  if storyboard_route == 'smart'
                  else ''
              )

              return {
                  'source_text': text,
                  'source_text_json': json.dumps(text, ensure_ascii=False),
                  'sentences_json': json.dumps(smart_sentences, ensure_ascii=False, indent=2),
                  'smart_storyboard_prompt': smart_storyboard_prompt,
                  'prompt_language_json': json.dumps(prompt_language, ensure_ascii=False),
                  'storyboard_prompt_language': prompt_language,
                  'storyboard_mode': mode,
                  'storyboard_route': storyboard_route,
                  'storyboard_count_mode': count_mode,
                  'requested_scene_count': str(requested_scene_count) if requested_scene_count is not None else '',
                  'min_scene_count': SMART_MIN_SCENE_COUNT,
                  'max_scene_count': max_scene_count,
                  'source_spans_json': json.dumps(source_spans, ensure_ascii=False, indent=2),
                  'use_source_spans': 'true' if use_source_spans else 'false',
                  'use_sentence_indices': 'false' if use_source_spans else 'true',
                  'count_instruction': count_instruction,
                  'deterministic_storyboard_plan_json': json.dumps(deterministic_plan, ensure_ascii=False, indent=2),
              }
