    - data:
        code: |
          import json
          from typing import Any


          def _load_plan(storyboard_plan_json: str) -> dict[str, Any]:
              raw = (storyboard_plan_json or '').strip()
              if not raw:
                  return {}
              plan = json.loads(raw)
              if not isinstance(plan, dict):
                  raise ValueError('storyboard_plan_json must be a JSON object')
              return plan


          def _frames(plan: dict[str, Any]) -> list[dict[str, Any]]:
              frames = plan.get('frames') or []
              if not isinstance(frames, list):
                  raise ValueError('storyboard_plan.frames must be a list')
              normalized = []
              for frame in frames:
                  if not isinstance(frame, dict):
                      raise ValueError('each storyboard frame must be an object')
                  normalized.append(frame)
              return normalized


          def main(storyboard_plan_json: str) -> dict:
              segments = []
              for position, frame in enumerate(_frames(_load_plan(storyboard_plan_json)), start=1):
                  index = frame.get('index') or position
                  frame_id = str(frame.get('frame_id') or f'frame_{int(index):04d}')
                  segments.append({
                      'frame_id': frame_id,
                      'index': index,
                      'source_text': str(frame.get('source_text') or '').strip(),
                  })
              return {
                  'segment_count': len(segments),
                  'segments_json': json.dumps(segments, ensure_ascii=False, indent=2),
              }
