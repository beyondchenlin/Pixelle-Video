<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="template:media-width" content="768">
    <meta name="template:media-height" content="768">
    <meta name="viewport" content="width=1080, height=1080">
    <title>Square Minimal Framed - 1080x1080</title>
    <style>
        @font-face {
            font-family: 'PixelleNotoSansSC';
            src: url('../../resources/hyperframes/runtime/fonts/assets/NotoSansSC-wght.ttf') format('truetype');
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { width: 1080px; height: 1080px; overflow: hidden; }

        body {
            font-family: 'PixelleNotoSansSC', 'PingFang SC', 'Source Han Sans', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fafafa;
            color: #1a1a1a;
            display: grid;
            grid-template-rows: 120px 602px 104px 82px;
            row-gap: 24px;
            padding: 58px 84px;
        }

        .header {
            text-align: center;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .title {
            font-size: 52px;
            font-weight: 650;
            line-height: 1.24;
            color: #2d3436;
            letter-spacing: 0;
            max-width: 830px;
        }

        .image-section {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        .image-container {
            width: 602px;
            height: 602px;
            aspect-ratio: 1 / 1;
            border: 2px solid #2d3436;
            background: #fff;
            padding: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            position: relative;
            overflow: hidden;
        }

        .image-container img {
            background: #fff;
        }

        .footer {
            text-align: center;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .text {
            font-size: 32px;
            font-weight: 450;
            line-height: 1.36;
            color: #636e72;
            letter-spacing: 0;
            max-width: 720px;
            margin: 0 auto;
        }

        .signature {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 28px;
            padding-top: 16px;
            border-top: 1px solid rgba(45, 52, 54, 0.16);
            position: relative;
            z-index: 2;
        }

        .signature-stack {
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
        }

        .signature-brand {
            font-size: 22px;
            font-weight: 600;
            color: #2d3436;
        }

        .signature-author {
            font-size: 26px;
            font-weight: 500;
            color: #2d3436;
        }

        .signature-desc {
            font-size: 20px;
            line-height: 1.4;
            color: #636e72;
        }

        @media (max-width: 1080px) {
            .title { font-size: 50px; }
            .text { font-size: 30px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">{{title}}</div>
    </div>

    <div class="image-section">
        <div class="image-container">
            {{pixelle_media_layer}}
        </div>
    </div>

    <div class="footer">
        <div class="text">{{text}}</div>
    </div>

    <div class="signature">
        <div class="signature-stack">
            <div class="signature-brand">{{brand=LanRen}}</div>
            <div class="signature-author">{{author=LanRen.AI}}</div>
            <div class="signature-desc">{{describe=LanRen}}</div>
        </div>
    </div>
</body>
</html>
