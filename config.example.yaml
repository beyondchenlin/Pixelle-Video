# Pixelle-Video Configuration
# Copy this file to config.yaml and fill in your settings
# ⚠️ Never commit config.yaml to Git!

config_version: 2
project_name: Pixelle-Video

# ==================== Logging Configuration ====================
logging:
  enabled: true
  level: INFO
  log_dir: _runtime/logs
  rotation_mb: 50
  retention_days: 14
  task_logs_enabled: true
  ai_creation_logs_enabled: true
  preview_chars: 120

# ==================== Runtime Lifecycle ====================
runtime:
  # Release generation-scoped Pixelle resources after the core becomes idle.
  # This is handled inside PixelleVideoCore, so Web, API, batch, and direct calls
  # share the same behavior without restarting the Streamlit process.
  release_resources_after_video_generation: true
  close_comfykit_after_generation: true
  close_html_browser_after_generation: true
  close_alignment_service_after_generation: true
  stop_managed_comfyui_backends_after_generation: true
  collect_garbage_after_generation: true
  log_process_memory_after_generation: true

# ==================== LLM Configuration ====================
# Supports any OpenAI SDK compatible API
llm:
  api_key: ""
  base_url: ""
  model: ""
  connect_timeout_seconds: 10
  read_timeout_seconds: 180
  write_timeout_seconds: 30
  pool_timeout_seconds: 10
  max_retries: 1

# Popular presets:
# Qwen Max:        base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"  model: "qwen-max"
# OpenAI GPT-4o:   base_url: "https://api.openai.com/v1"                          model: "gpt-4o"
# DeepSeek:        base_url: "https://api.deepseek.com"                           model: "deepseek-chat"
# Ollama (Local):  base_url: "http://localhost:11434/v1"                          model: "llama3.2"

# ==================== Reference Image / Vision ====================
# Production default is off. Enable internally first for prompt-only reference
# image assetization before turning on Vision analysis or workflow injection.
reference_image:
  enabled: false
  # Keep the Web entry visible by default; per-run use still requires upload + toggle.
  web_ui_enabled: true
  analysis_mode: off              # off | auto | required
  workflow_injection_mode: off    # off | auto | required
  profile_merge_mode: supplement  # supplement | override | strict
  allowed_extensions: [".jpg", ".jpeg", ".png", ".webp"]
  max_upload_size_mb: 20
  max_vision_edge_px: 1024
  max_workflow_edge_px: 2048
  strip_exif: true
  convert_to_png_for_workflow: false
  allow_ambiguous_image_param: false
  # Optional selfhost workflow parameter whitelist for physical reference image
  # injection. Keep empty until the target workflow is verified.
  # Supported keys are full workflow key, workflow filename, or "*".
  workflow_param_overrides: {}
  # workflow_param_overrides:
  #   "selfhost/image_reference.json": "reference_image"
  #   "image_reference.json":
  #     param_names: ["reference_image"]
  #   "*":
  #     reference_image: ["reference_image"]

# Dedicated multimodal model settings for future structured reference-image
# analysis. Keep disabled unless the configured endpoint supports image input.
vision_llm:
  enabled: false
  api_key: ""
  base_url: ""
  model: ""
  temperature: 0.2
  max_tokens: 1200
  max_image_size_mb: 5
  max_vision_edge_px: 1024
  unavailable_policy: skip        # skip | fail
  force_supports_vision: null

# ==================== Governed Direct Media Providers ====================
# Direct providers stay behind the same prompt trace, reference-image policy,
# and media-result artifact boundary as ComfyUI/RunningHub workflows.
direct_media:
  enabled: false
  openai_image:
    enabled: false
    api_key: ""
    base_url: "https://api.openai.com/v1"
    connect_timeout_seconds: 10
    read_timeout_seconds: 180
    write_timeout_seconds: 30
    pool_timeout_seconds: 10
    max_retries: 1
    max_output_size_mb: 25
    max_output_pixels: 20000000
    max_output_edge_px: 8192

# ==================== ComfyUI Configuration ====================
comfyui:
  # Global ComfyUI settings
  comfyui_url: http://127.0.0.1:8000  # ComfyUI server URL (required for selfhost workflows)
  executor_type: null  # Optional override: null=auto (recommended HTTP default), websocket only for explicit opt-in
  backend_management_mode: required  # recommended: Pixelle owns the complete local service lifecycle
  # A Pixelle-owned service is started on demand, stopped after each deliberate image
  # or audio batch, and started again only when the next local workflow needs it.
  # External backends are never stopped. Set stop_after_batch to false only when
  # keeping models resident is an explicit performance choice.
  #
  # Managed single-backend profile (image and TTS share one process):
  #   managed: true               # Allow Pixelle to start the complete service when absent
  #   stop_after_batch: true      # Stop after a batch; the next batch starts on demand
  #   python_exe: ""              # Path to Python interpreter for managed backends
  #   comfyui_root: ""            # Path to ComfyUI installation for managed backends
  backends:
    default:
      url: http://127.0.0.1:8000
      python_exe: E:/ComfyUIData/.venv/Scripts/python.exe
      comfyui_root: E:/comfyui/resources/ComfyUI
      managed: true
      stop_after_batch: true
      resource_policy: auto       # Safe managed-service default; performance is explicit opt-in
      minimum_free_commit_gb: 12  # Refuse startup before Windows commit exhaustion
      data_root: E:/ComfyUIData/pixelle
      shared_base_path: E:/ComfyUIData
      runtime_dir: _runtime/comfyui
      logs_dir: logs/comfyui
      database_url: sqlite:///E:/ComfyUIData/pixelle/user/comfyui.db
  workflow_routing:
    image: default
    tts: default
    default: default
  comfyui_api_key: ""  # ComfyUI API key (optional, get from https://platform.comfy.org/profile/api-keys)
  # Note for Docker users: Use host.docker.internal:8188 (Mac/Windows) or host IP address (Linux)
  runninghub_api_key: ""  # RunningHub API key (required for runninghub workflows)
  runninghub_concurrent_limit: 1  # Concurrent execution limit for RunningHub (1-10, default 1 for regular members)

  # TTS-specific configuration
  tts:
    inference_mode: comfyui  # Options: local, comfyui
    local:
      voice: zh-CN-YunjianNeural
      speed: 1.2
    comfyui:
      default_workflow: selfhost/tts_omnivoice_longform_bf16.json  # Default ComfyUI TTS workflow

  # Image-specific configuration
  image:
    # Required: Default workflow to use
    # Options: selfhost/image_z_image_turbo_gguf.json (recommended default illustration flow)
    #          runninghub/image_flux.json (cloud alternative)
    default_workflow: selfhost/image_z_image_turbo_gguf.json

    # Image prompt prefix (optional)
    prompt_prefix: "Minimalist black-and-white matchstick figure style illustration, clean lines, simple sketch style"

    # Image prompt prefix library (optional)
    # The active library item is used for real image generation.
    # The legacy prompt_prefix above remains as a fallback for older configs.
    prompt_prefix_library:
      active_prefix_id: builtin_childrens_storybook_warm
      items:
        - id: builtin_childrens_storybook_warm
          name: "Warm Storybook"
          content: "warm children's storybook illustration, soft lighting, gentle hand-painted texture, expressive characters, clean composition"
          style_category_id: storybook
          scene_category_id: childrens_story
          source: builtin
          is_builtin: true
          note: "Soft, healing visuals for stories and family-friendly content."
          created_at: "2026-04-20T00:00:00Z"

  # Video-specific configuration
  video:
    # Required: Default workflow to use (no fallback)
    # Options: runninghub/video_wan2.1_fusionx.json (recommended, no local setup)
    #          selfhost/video_wan2.1_fusionx.json (requires local ComfyUI)
    default_workflow: runninghub/video_wan2.1_fusionx.json

    # Video prompt prefix (optional)
    prompt_prefix: "Minimalist black-and-white matchstick figure style illustration, clean lines, simple sketch style"

# ==================== Template Configuration ====================
# Configure default template for video generation
template:
  # Default frame template to use when not explicitly specified
  # Determines video aspect ratio and layout style
  # Template naming convention:
  #   - static_*.html: Static style templates (no AI-generated media)
  #   - image_*.html: Templates requiring AI-generated images
  #   - video_*.html: Templates requiring AI-generated videos
  # Options: 
  #   - 1080x1920 (vertical/portrait): image_default.html, image_modern.html, image_elegant.html, static_simple.html, etc.
  #   - 1080x1080 (square): image_minimal_framed.html, etc.
  #   - 1920x1080 (horizontal/landscape): image_film.html, image_full.html, etc.
  # See templates/ directory for all available templates
  default_template: "1080x1920/image_default.html"

# ==================== Render Configuration ====================
# Render contract defaults used by storyboard and persistence layers
render:
  # Options:
  #   - legacy: existing non-HyperFrames rendering path
  #   - hyperframes_compiled: new compiled HyperFrames rendering path
  #   - ffmpeg_manifest: pure FFmpeg assembly (fastest, no extra deps)
  backend: ffmpeg_manifest
  timing:
    tts_batching_mode: paragraph
    tts_audio_strategy: master_track
    tts_split_mode: internal_only
    tts_batch_max_sentences: 8
    tts_batch_max_chars: 220
    subtitle_alignment_engine: qwen_forced_aligner
    silence_trim_tool: null
    silence_trim_margin_ms: 120
