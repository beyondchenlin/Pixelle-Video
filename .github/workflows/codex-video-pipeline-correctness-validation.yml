name: Codex video pipeline correctness validation

on:
  push:
    branches:
      - codex/video-pipeline-correctness

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile
        run: |
          python -m py_compile pixelle_video/services/video.py pixelle_video/pipelines/standard.py tests/services/test_video_pipeline_correctness.py
      - name: Test
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/services/test_video_pipeline_correctness.py tests/services/test_ffmpeg_h264_executor.py tests/architecture/test_ffmpeg_reencode_single_owner.py
      - name: Ruff
        run: |
          python -m ruff check pixelle_video/services/video.py pixelle_video/pipelines/standard.py tests/services/test_video_pipeline_correctness.py
