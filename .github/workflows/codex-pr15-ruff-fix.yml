name: Codex PR15 Ruff fix

on:
  push:
    branches:
      - codex/video-pipeline-correctness

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/video-pipeline-correctness
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff==0.16.2"
      - name: Apply exact Ruff fixes
        run: python -m ruff check --fix pixelle_video/services/video.py pixelle_video/pipelines/standard.py tests/services/test_video_pipeline_correctness.py
      - name: Commit Ruff fixes
        shell: bash
        run: |
          rm .github/workflows/codex-pr15-ruff-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: normalize video pipeline correctness changes"
          git push origin HEAD:codex/video-pipeline-correctness
