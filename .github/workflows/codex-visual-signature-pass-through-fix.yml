name: Codex visual signature pass-through fix

on:
  push:
    branches:
      - codex/visual-signature-single-owner-v45
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/visual-signature-single-owner-v45
          fetch-depth: 0
      - name: Apply patch
        run: python tools/codex_patch_visual_signature.py
      - name: Syntax check
        run: |
          python -m py_compile pixelle_video/services/series_visual_signature_projection_service.py
          python -m py_compile tests/services/test_series_visual_signature_projection_service.py
      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/codex-visual-signature-pass-through-fix.yml
          rm tools/codex_patch_visual_signature.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: enforce full visual signature contract before pass-through"
          git push origin HEAD:codex/visual-signature-single-owner-v45
