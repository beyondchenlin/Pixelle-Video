name: Codex visual signature single owner review2

on:
  push:
    branches:
      - codex/visual-signature-runtime-single-owner

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/visual-signature-runtime-single-owner
          fetch-depth: 0
      - name: Apply second-review trust-boundary fix
        run: python tools/codex_patch_visual_signature_single_owner_review2.py
      - name: Syntax check
        run: |
          python -m py_compile pixelle_video/utils/content_generators.py
          python -m py_compile pixelle_video/services/visual_prompt_composer.py
          python -m py_compile tests/architecture/test_visual_signature_runtime_single_owner.py
      - name: Commit second-review fix
        shell: bash
        run: |
          rm .github/workflows/codex-visual-signature-single-owner-review2.yml
          rm tools/codex_patch_visual_signature_single_owner_review2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: revalidate canonical identity at every generation entry"
          git push origin HEAD:codex/visual-signature-runtime-single-owner
