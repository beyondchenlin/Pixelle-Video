name: Video Encoding CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - ".github/workflows/video-encoding-ci.yml"
      - "pixelle_video/utils/ffmpeg_encoder.py"
      - "pixelle_video/services/video.py"
      - "pixelle_video/services/video_operations.py"
      - "pixelle_video/services/video_encoder_executor.py"
      - "pixelle_video/services/element_animation_renderer.py"
      - "tools/hyperframes_bridge/**"
      - "tests/test_ffmpeg_encoder.py"
      - "tests/services/test_video_encoder_executor.py"
      - "tests/services/test_video_service_unified_encoder.py"
  push:
    branches:
      - dev
      - main
    paths:
      - ".github/workflows/video-encoding-ci.yml"
      - "pixelle_video/utils/ffmpeg_encoder.py"
      - "pixelle_video/services/video.py"
      - "pixelle_video/services/video_operations.py"
      - "pixelle_video/services/video_encoder_executor.py"
      - "pixelle_video/services/element_animation_renderer.py"
      - "tools/hyperframes_bridge/**"
      - "tests/test_ffmpeg_encoder.py"
      - "tests/services/test_video_encoder_executor.py"
      - "tests/services/test_video_service_unified_encoder.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-encoding-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-video-encoding-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile video encoding modules
        shell: bash
        run: |
          files=(pixelle_video/utils/ffmpeg_encoder.py)
          for candidate in \
            pixelle_video/services/video.py \
            pixelle_video/services/video_operations.py \
            pixelle_video/services/video_encoder_executor.py \
            pixelle_video/services/element_animation_renderer.py; do
            if [[ -f "$candidate" ]]; then
              files+=("$candidate")
            fi
          done
          python -m py_compile "${files[@]}"

      - name: Run video encoding tests
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          tests=(tests/test_ffmpeg_encoder.py)
          for candidate in \
            tests/services/test_video_encoder_executor.py \
            tests/services/test_video_service_unified_encoder.py; do
            if [[ -f "$candidate" ]]; then
              tests+=("$candidate")
            fi
          done
          python -m pytest -q "${tests[@]}"

      - name: Ruff video encoding scope
        shell: bash
        run: |
          files=(pixelle_video/utils/ffmpeg_encoder.py tests/test_ffmpeg_encoder.py)
          for candidate in \
            pixelle_video/services/video.py \
            pixelle_video/services/video_operations.py \
            pixelle_video/services/video_encoder_executor.py \
            pixelle_video/services/element_animation_renderer.py \
            tests/services/test_video_encoder_executor.py \
            tests/services/test_video_service_unified_encoder.py; do
            if [[ -f "$candidate" ]]; then
              files+=("$candidate")
            fi
          done
          python -m ruff check "${files[@]}"

  hyperframes-bridge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: tools/hyperframes_bridge/package-lock.json

      - name: Install bridge dependencies
        working-directory: tools/hyperframes_bridge
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROME_HEADLESS_SHELL_DOWNLOAD: "true"
        run: npm ci --omit=dev

      - name: Run bridge tests
        working-directory: tools/hyperframes_bridge
        run: npm test
