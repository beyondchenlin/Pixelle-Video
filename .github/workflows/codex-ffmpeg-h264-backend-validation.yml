name: Codex FFmpeg H264 backend validation

on:
  push:
    branches:
      - codex/ffmpeg-h264-backend-capability

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile encoder scope
        run: |
          python -m py_compile \
            pixelle_video/utils/ffmpeg_encoder.py \
            pixelle_video/services/video.py \
            tests/test_ffmpeg_encoder.py \
            tests/services/test_video_h264_backend.py
      - name: Run encoder tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_ffmpeg_encoder.py \
            tests/services/test_video_h264_backend.py
      - name: Ruff encoder scope
        run: |
          python -m ruff check \
            pixelle_video/utils/ffmpeg_encoder.py \
            pixelle_video/services/video.py \
            tests/test_ffmpeg_encoder.py \
            tests/services/test_video_h264_backend.py
