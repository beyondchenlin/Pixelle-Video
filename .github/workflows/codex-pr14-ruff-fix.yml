name: Codex PR14 Ruff fix

on:
  push:
    branches:
      - codex/ffmpeg-unified-reencode-executor

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ffmpeg-unified-reencode-executor
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff==0.16.2"
      - name: Apply exact Ruff fixes
        run: python -m ruff check --fix pixelle_video/services/ffmpeg_h264_executor.py pixelle_video/services/video.py pixelle_video/services/element_animation_renderer.py tests/services/test_ffmpeg_h264_executor.py tests/architecture/test_ffmpeg_reencode_single_owner.py tests/services/test_video_h264_backend.py
      - name: Commit Ruff fixes
        shell: bash
        run: |
          rm .github/workflows/codex-pr14-ruff-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: normalize shared H264 executor changes"
          git push origin HEAD:codex/ffmpeg-unified-reencode-executor
