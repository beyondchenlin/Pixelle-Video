name: Codex FFmpeg backend review1

on:
  push:
    branches:
      - codex/ffmpeg-h264-backend-capability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ffmpeg-h264-backend-capability
          fetch-depth: 0
      - name: Apply review fix
        run: python tools/codex_patch_ffmpeg_backend_review1.py
      - name: Syntax check
        run: python -m py_compile pixelle_video/services/video.py
      - name: Commit review fix
        shell: bash
        run: |
          rm .github/workflows/codex-ffmpeg-backend-review1.yml
          rm tools/codex_patch_ffmpeg_backend_review1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: disable hardware only after proven CPU fallback"
          git push origin HEAD:codex/ffmpeg-h264-backend-capability
