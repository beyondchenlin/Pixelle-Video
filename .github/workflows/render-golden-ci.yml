  pull_request:
    branches:
      - dev
      - main
    paths:
      - ".github/workflows/render-golden-ci.yml"
      - ".github/workflows/render-hardware-certification.yml"
      - "api/schemas/text_rendering_preview.py"
      - "api/schemas/video.py"
      - "config.example.yaml"
      - "pixelle_video/render_backend.py"
      - "pixelle_video/models/media_placement.py"
      - "pixelle_video/models/size_contract.py"
      - "pixelle_video/models/template_render_context.py"
      - "pixelle_video/models/text_style.py"
      - "pixelle_video/services/ass_style_builder.py"
      - "pixelle_video/services/ass_text_adapter.py"
      - "pixelle_video/services/ffmpeg_manifest_renderer.py"
      - "pixelle_video/services/frame_html.py"
      - "pixelle_video/services/hyperframes_compiler.py"
      - "pixelle_video/services/hyperframes_project_service.py"
      - "pixelle_video/services/hyperframes_*.py"
      - "pixelle_video/services/layered_template_adapters/**"
      - "pixelle_video/services/persistence.py"
      - "pixelle_video/services/render_*.py"
      - "pixelle_video/services/render_artifact_analyzer.py"
      - "pixelle_video/services/render_hardware_certification.py"
      - "pixelle_video/services/render_qualification.py"
      - "pixelle_video/services/text_content_sanitizer.py"
      - "pixelle_video/services/text_layout_planner.py"
      - "pixelle_video/services/video.py"
      - "pixelle_video/services/video_encoder_executor.py"
      - "pixelle_video/utils/ffmpeg_encoder.py"
      - "pixelle_video/utils/filesystem.py"
      - "resources/hyperframes/templates/render_contract_golden/**"
      - "resources/hyperframes/runtime/**"
      - "scripts/run_render_qualification.py"
      - "tests/fixtures/render_qualification/**"
      - "tests/test_ass_style_builder.py"
      - "tests/test_ass_text_adapter.py"
      - "tests/test_hyperframes_compiler.py"
      - "tests/test_hyperframes_project_service.py"
      - "tests/test_hyperframes_*.py"
      - "tests/test_ffmpeg_encoder.py"
      - "tests/test_ffmpeg_manifest_renderer.py"
      - "tests/test_media_placement.py"
      - "tests/test_render_artifact_analyzer.py"
      - "tests/test_render_backend_defaults.py"
      - "tests/test_render_backend_ui.py"
      - "tests/test_render_package_models.py"
      - "tests/test_render_hardware_certification.py"
      - "tests/test_render_hardware_workflow.py"
      - "tests/test_render_qualification.py"
      - "tests/test_render_*.py"
      - "tests/test_run_render_qualification.py"
      - "tests/test_size_contract.py"
      - "tests/test_text_layout_planner.py"
      - "tests/test_text_style_models.py"
      - "tests/test_video_api.py"
      - "tests/services/test_video_service_unified_encoder.py"
      - "tools/hyperframes_bridge/**"
      - "web/i18n/locales/en_US.json"
      - "web/i18n/locales/zh_CN.json"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches:
      - dev
      - main
    paths:
      - ".github/workflows/render-golden-ci.yml"
      - ".github/workflows/render-hardware-certification.yml"
      - "api/schemas/text_rendering_preview.py"
      - "api/schemas/video.py"
      - "config.example.yaml"
      - "pixelle_video/render_backend.py"
      - "pixelle_video/models/media_placement.py"
      - "pixelle_video/models/size_contract.py"
      - "pixelle_video/models/template_render_context.py"
      - "pixelle_video/models/text_style.py"
      - "pixelle_video/services/ass_style_builder.py"
      - "pixelle_video/services/ass_text_adapter.py"
      - "pixelle_video/services/ffmpeg_manifest_renderer.py"
      - "pixelle_video/services/frame_html.py"
      - "pixelle_video/services/hyperframes_compiler.py"
      - "pixelle_video/services/hyperframes_project_service.py"
      - "pixelle_video/services/hyperframes_*.py"
      - "pixelle_video/services/layered_template_adapters/**"
      - "pixelle_video/services/persistence.py"
      - "pixelle_video/services/render_*.py"
      - "pixelle_video/services/render_artifact_analyzer.py"
      - "pixelle_video/services/render_hardware_certification.py"
      - "pixelle_video/services/render_qualification.py"
      - "pixelle_video/services/text_content_sanitizer.py"
      - "pixelle_video/services/text_layout_planner.py"
      - "pixelle_video/services/video.py"
      - "pixelle_video/services/video_encoder_executor.py"
      - "pixelle_video/utils/ffmpeg_encoder.py"
      - "pixelle_video/utils/filesystem.py"
      - "resources/hyperframes/templates/render_contract_golden/**"
      - "resources/hyperframes/runtime/**"
      - "scripts/run_render_qualification.py"
      - "tests/fixtures/render_qualification/**"
      - "tests/test_ass_style_builder.py"
      - "tests/test_ass_text_adapter.py"
      - "tests/test_hyperframes_compiler.py"
      - "tests/test_hyperframes_project_service.py"
      - "tests/test_hyperframes_*.py"
      - "tests/test_ffmpeg_encoder.py"
      - "tests/test_ffmpeg_manifest_renderer.py"
      - "tests/test_media_placement.py"
      - "tests/test_render_artifact_analyzer.py"
      - "tests/test_render_backend_defaults.py"
      - "tests/test_render_backend_ui.py"
      - "tests/test_render_package_models.py"
      - "tests/test_render_hardware_certification.py"
      - "tests/test_render_hardware_workflow.py"
      - "tests/test_render_qualification.py"
      - "tests/test_render_*.py"
      - "tests/test_run_render_qualification.py"
      - "tests/test_size_contract.py"
      - "tests/test_text_layout_planner.py"
      - "tests/test_text_style_models.py"
      - "tests/test_video_api.py"
      - "tests/services/test_video_service_unified_encoder.py"
      - "tools/hyperframes_bridge/**"
      - "web/i18n/locales/en_US.json"
      - "web/i18n/locales/zh_CN.json"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-golden-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  final-video-golden-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/tools/hyperframes_bridge/.cache/puppeteer
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_SKIP_CHROME_HEADLESS_SHELL_DOWNLOAD: "true"
      PIXELLE_REQUIRE_PINNED_BROWSER: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.12.0"
          cache: npm
          cache-dependency-path: tools/hyperframes_bridge/package-lock.json

      - name: Restore locked browser cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: tools/hyperframes_bridge/.cache/puppeteer
          key: hyperframes-browser-${{ runner.os }}-${{ hashFiles('tools/hyperframes_bridge/package-lock.json') }}

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install uv==0.10.7
          uv sync --frozen --extra dev

      - name: Install locked HyperFrames bridge
        working-directory: tools/hyperframes_bridge
        run: npm ci --omit=dev

      - name: Install and verify locked browser runtime
        working-directory: tools/hyperframes_bridge
        run: |
          npm run browser:install
          npm run runtime:verify
          npm test

      - name: Run qualification unit tests
        run: |
          uv run pytest -q \
            tests/test_ass_style_builder.py \
            tests/test_ass_text_adapter.py \
            tests/test_ffmpeg_encoder.py \
            tests/test_ffmpeg_manifest_renderer.py \
            tests/test_hyperframes_compiler.py \
            tests/test_hyperframes_renderer.py \
            tests/test_hyperframes_project_service.py \
            tests/test_media_placement.py \
            tests/test_packaging_contract.py \
            tests/test_render_artifact_analyzer.py \
            tests/test_render_backend_defaults.py \
            tests/test_render_backend_ui.py \
            tests/test_render_package_models.py \
            tests/test_render_hardware_certification.py \
            tests/test_render_hardware_workflow.py \
            tests/test_render_qualification.py \
            tests/test_run_render_qualification.py \
            tests/test_size_contract.py \
            tests/test_text_layout_planner.py \
            tests/test_text_style_models.py \
            tests/test_video_api.py \
            tests/services/test_video_service_unified_encoder.py

      - name: Run twelve-case final-video golden matrix
        env:
          PIXELLE_HYPERFRAMES_USE_GPU: "false"
        run: |
          uv run python scripts/run_render_qualification.py golden \
            --output-root "${RUNNER_TEMP}/render-qualification"

      - name: Upload final-video evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: render-golden-evidence
          path: |
            ${{ runner.temp }}/render-qualification/**/*.json
            ${{ runner.temp }}/render-qualification/**/*.png
            ${{ runner.temp }}/render-qualification/**/*.mp4
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1
