name: Codex FFmpeg backend video service integration

on:
  push:
    branches:
      - codex/ffmpeg-h264-backend-capability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ffmpeg-h264-backend-capability
          fetch-depth: 0
      - name: Apply video service patch
        run: python tools/codex_patch_ffmpeg_backend_video_service.py
      - name: Syntax check
        run: |
          python -m py_compile pixelle_video/utils/ffmpeg_encoder.py
          python -m py_compile pixelle_video/services/video.py
      - name: Commit integration
        shell: bash
        run: |
          rm .github/workflows/codex-ffmpeg-backend-video-service.yml
          rm tools/codex_patch_ffmpeg_backend_video_service.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: consume family-specific H264 backend plans"
          git push origin HEAD:codex/ffmpeg-h264-backend-capability
