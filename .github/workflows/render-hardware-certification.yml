name: Render Hardware Certification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-hardware-certification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hardware-device:
    name: Real device ${{ matrix.codec }}
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - codec: h264_nvenc
            runner_label: render-h264-nvenc
            qsv_device: ""
            vaapi_device: ""
          - codec: h264_qsv
            runner_label: render-h264-qsv
            qsv_device: /dev/dri/renderD128
            vaapi_device: ""
          - codec: h264_vaapi
            runner_label: render-h264-vaapi
            qsv_device: ""
            vaapi_device: /dev/dri/renderD128
    runs-on: [self-hosted, render-hardware, "${{ matrix.runner_label }}"]
    environment: render-hardware-certification
    timeout-minutes: 30
    env:
      PIXELLE_FFMPEG_QSV_DEVICE: ${{ matrix.qsv_device }}
      PIXELLE_FFMPEG_VAAPI_DEVICE: ${{ matrix.vaapi_device }}

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Verify device runner dependencies
        run: ffmpeg -hide_banner -version

      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.10.7
          uv sync --frozen --extra dev

      - name: Render with required hardware codec
        run: uv run python scripts/run_render_qualification.py hardware --hardware-codec "${{ matrix.codec }}" --output-root "${{ runner.temp }}/render-hardware-${{ matrix.codec }}"

      - name: Upload exact-codec evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hardware-${{ matrix.codec }}
          path: |
            ${{ runner.temp }}/render-hardware-${{ matrix.codec }}/hardware_report.json
            ${{ runner.temp }}/render-hardware-${{ matrix.codec }}/hardware/*.mp4
            ${{ runner.temp }}/render-hardware-${{ matrix.codec }}/hardware/*.render_probe.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 1

  aggregate-certification:
    name: Cross-device release certification
    if: always() && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    needs: hardware-device
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install verifier dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install uv==0.10.7
          uv sync --frozen --extra dev

      - name: Prepare evidence directory
        run: mkdir -p "${RUNNER_TEMP}/render-hardware-evidence"

      - name: Download device evidence
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: hardware-*
          path: ${{ runner.temp }}/render-hardware-evidence

      - name: Require all supported real devices
        run: uv run python scripts/run_render_qualification.py hardware-certify --hardware-evidence-root "${RUNNER_TEMP}/render-hardware-evidence" --expected-revision "${GITHUB_SHA}" --expected-run-id "${GITHUB_RUN_ID}" --output-root "${RUNNER_TEMP}/render-hardware-certification"

      - name: Upload aggregate certification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hardware-cross-device-certification
          path: ${{ runner.temp }}/render-hardware-certification/hardware_certification_report.json
          if-no-files-found: warn
          retention-days: 30
