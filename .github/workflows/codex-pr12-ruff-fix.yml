name: Codex PR12 Ruff fix

on:
  push:
    branches:
      - codex/visual-signature-runtime-single-owner

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/visual-signature-runtime-single-owner
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff==0.16.2"
      - name: Apply exact Ruff fix
        run: python -m ruff check --fix tests/architecture/test_visual_signature_runtime_single_owner.py
      - name: Commit Ruff fix
        shell: bash
        run: |
          rm .github/workflows/codex-pr12-ruff-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: normalize visual signature architecture test imports"
          git push origin HEAD:codex/visual-signature-runtime-single-owner
