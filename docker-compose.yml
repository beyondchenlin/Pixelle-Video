# Build Arguments Configuration
# You can override these by setting environment variables before running docker-compose
#
# Example for China environment (auto uses Tsinghua mirror):
#   USE_CN_MIRROR=true docker-compose up -d
#
# Example for international environment (default):
#   docker-compose up -d

x-pixelle-runtime-env: &pixelle-runtime-env
  TZ: Asia/Shanghai
  PIXELLE_VIDEO_ROOT: /app
  PIXELLE_VIDEO_RUNTIME_ROOT: /app/_runtime
  TMP: /app/_runtime/tmp
  TEMP: /app/_runtime/tmp
  TMPDIR: /app/_runtime/tmp
  UV_CACHE_DIR: /app/_runtime/uv-cache
  RUFF_CACHE_DIR: /app/_runtime/ruff-cache

x-pixelle-app-volumes: &pixelle-app-volumes
  - ./config.yaml:/app/config.yaml
  - ./data:/app/data
  - ./output:/app/output
  - ./_runtime:/app/_runtime

services:
  # Init Service - Ensures config.yaml exists before other services start
  # This fixes the Docker issue where mounting a non-existent file creates a directory
  init:
    image: alpine:latest
    volumes:
      - ./:/workspace
    command: >
      sh -c '
        if [ -d /workspace/config.yaml ]; then
          echo "⚠️  config.yaml is a directory, removing it...";
          rm -rf /workspace/config.yaml;
        fi;
        if [ ! -f /workspace/config.yaml ] && [ -f /workspace/config.example.yaml ]; then
          echo "📋 Creating config.yaml from config.example.yaml...";
          cp /workspace/config.example.yaml /workspace/config.yaml;
          echo "✅ config.yaml created successfully!";
        else
          echo "✅ config.yaml already exists.";
        fi
      '
    restart: "no"

  # PostgreSQL - authoritative task state
  postgres:
    image: postgres:16
    container_name: pixelle-video-postgres
    environment:
      - POSTGRES_DB=pixelle
      - POSTGRES_USER=pixelle
      - POSTGRES_PASSWORD=pixelle
      - TZ=Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelle -d pixelle"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pixelle-network

  # Redis - distributed locks and worker leases
  redis:
    image: redis:7
    container_name: pixelle-video-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - pixelle-network

  # Migration Service - runs database migrations before API/worker start
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USE_CN_MIRROR: ${USE_CN_MIRROR:-false}
        PIXELLE_UID: ${PIXELLE_UID:-1000}
        PIXELLE_GID: ${PIXELLE_GID:-1000}
    container_name: pixelle-video-migrate
    command: .venv/bin/python -m api.tasks.migrate upgrade
    depends_on:
      postgres:
        condition: service_healthy
    volumes: *pixelle-app-volumes
    environment:
      <<: *pixelle-runtime-env
      PIXELLE_TASK_BACKEND: postgres
      PIXELLE_POSTGRES_DSN: postgresql+asyncpg://pixelle:pixelle@postgres:5432/pixelle
      PIXELLE_REDIS_URL: redis://redis:6379/0
      PIXELLE_REQUIRE_DISTRIBUTED_COORDINATION: "true"
      PIXELLE_GENERATION_LEASE_TTL_SECONDS: "120"
      PIXELLE_GENERATION_HEARTBEAT_SECONDS: "30"
      PIXELLE_GENERATION_SUBMIT_LOCK_WAIT_SECONDS: "2"
      PIXELLE_GENERATION_SUBMIT_LOCK_POLL_SECONDS: "0.05"
      PIXELLE_ARTIFACT_BACKEND: local
      PIXELLE_ARTIFACT_BASE_PATH: output
      PIXELLE_ARTIFACT_BASE_URL: /api/files
    restart: "no"
    networks:
      - pixelle-network

  # API Service - FastAPI backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USE_CN_MIRROR: ${USE_CN_MIRROR:-false}
        PIXELLE_UID: ${PIXELLE_UID:-1000}
        PIXELLE_GID: ${PIXELLE_GID:-1000}
    container_name: pixelle-video-api
    command: .venv/bin/python api/app.py --host 0.0.0.0 --port 8000
    depends_on:
      init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes: *pixelle-app-volumes
    environment:
      <<: *pixelle-runtime-env
      PIXELLE_TASK_BACKEND: postgres
      PIXELLE_POSTGRES_DSN: postgresql+asyncpg://pixelle:pixelle@postgres:5432/pixelle
      PIXELLE_REDIS_URL: redis://redis:6379/0
      PIXELLE_REQUIRE_DISTRIBUTED_COORDINATION: "true"
      PIXELLE_GENERATION_LEASE_TTL_SECONDS: "120"
      PIXELLE_GENERATION_HEARTBEAT_SECONDS: "30"
      PIXELLE_GENERATION_SUBMIT_LOCK_WAIT_SECONDS: "2"
      PIXELLE_GENERATION_SUBMIT_LOCK_POLL_SECONDS: "0.05"
      PIXELLE_EXECUTION_MODE: worker
      PIXELLE_ARTIFACT_BACKEND: local
      PIXELLE_ARTIFACT_BASE_PATH: output
      PIXELLE_ARTIFACT_BASE_URL: /api/files
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pixelle-network

  # Worker Service - claims and executes pending generation tasks
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USE_CN_MIRROR: ${USE_CN_MIRROR:-false}
        PIXELLE_UID: ${PIXELLE_UID:-1000}
        PIXELLE_GID: ${PIXELLE_GID:-1000}
    container_name: pixelle-video-worker
    command: .venv/bin/python -m api.tasks.worker
    depends_on:
      init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes: *pixelle-app-volumes
    environment:
      <<: *pixelle-runtime-env
      PIXELLE_TASK_BACKEND: postgres
      PIXELLE_POSTGRES_DSN: postgresql+asyncpg://pixelle:pixelle@postgres:5432/pixelle
      PIXELLE_REDIS_URL: redis://redis:6379/0
      PIXELLE_REQUIRE_DISTRIBUTED_COORDINATION: "true"
      PIXELLE_GENERATION_LEASE_TTL_SECONDS: "120"
      PIXELLE_GENERATION_HEARTBEAT_SECONDS: "30"
      PIXELLE_GENERATION_SUBMIT_LOCK_WAIT_SECONDS: "2"
      PIXELLE_GENERATION_SUBMIT_LOCK_POLL_SECONDS: "0.05"
      PIXELLE_EXECUTION_MODE: worker
      PIXELLE_ARTIFACT_BACKEND: local
      PIXELLE_ARTIFACT_BASE_PATH: output
      PIXELLE_ARTIFACT_BASE_URL: /api/files
      PIXELLE_WORKER_POLL_INTERVAL_SECONDS: "2"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pixelle-network

  # Web UI Service - Streamlit frontend
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USE_CN_MIRROR: ${USE_CN_MIRROR:-false}
        PIXELLE_UID: ${PIXELLE_UID:-1000}
        PIXELLE_GID: ${PIXELLE_GID:-1000}
    container_name: pixelle-video-web
    command: .venv/bin/streamlit run web/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8501:8501"
    volumes: *pixelle-app-volumes
    environment:
      <<: *pixelle-runtime-env
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      PIXELLE_TASK_BACKEND: postgres
      PIXELLE_POSTGRES_DSN: postgresql+asyncpg://pixelle:pixelle@postgres:5432/pixelle
      PIXELLE_REDIS_URL: redis://redis:6379/0
      PIXELLE_REQUIRE_DISTRIBUTED_COORDINATION: "true"
      PIXELLE_GENERATION_LEASE_TTL_SECONDS: "120"
      PIXELLE_GENERATION_HEARTBEAT_SECONDS: "30"
      PIXELLE_GENERATION_SUBMIT_LOCK_WAIT_SECONDS: "2"
      PIXELLE_GENERATION_SUBMIT_LOCK_POLL_SECONDS: "0.05"
      PIXELLE_EXECUTION_MODE: worker
      PIXELLE_ARTIFACT_BACKEND: local
      PIXELLE_ARTIFACT_BASE_PATH: output
      PIXELLE_ARTIFACT_BASE_URL: /api/files
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pixelle-network

volumes:
  postgres_data:
  redis_data:

networks:
  pixelle-network:
    driver: bridge
